<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cơm Nhà  -  Recipe Index</title>
<meta name="description" content="A personal Vietnamese recipe index  -  100 dishes from Northern, Central, and Southern Vietnam.">
<meta name="theme-color" content="#8b3e00">
<meta property="og:title" content="Cơm Nhà  -  Recipe Index">
<meta property="og:url" content="https://annalinhvu.github.io/portfolio/projects/recipes/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400;1,600&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Geist';
  font-style: normal; font-display: swap; font-weight: 100 900;
  src: url(https://cdn.jsdelivr.net/fontsource/fonts/geist:vf@latest/latin-wght-normal.woff2) format('woff2-variations');
}
</style>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root[data-theme="light"]{
  --bg:#f4f3f6;
  --card:#ffffff;
  --text-1:#1c1a18;
  --text-2:#3c3830;
  --text-3:#6c6860;
  --text-4:#9c9888;
  --accent:#8B6BD4;
  --accent-2:#7A5BC4;
  --terra:#8a4030;
  --gold:#7a6828;
  --gold-l:#9a8838;
  --border:#dddae6;
  --sh:0 2px 8px rgba(28,26,24,.07),0 1px 3px rgba(28,26,24,.04);
  --sh-h:0 6px 20px rgba(28,26,24,.12),0 3px 8px rgba(28,26,24,.07);
}
:root[data-theme="dark"]{
  --bg:#110E1A;
  --card:#1C1828;
  --text-1:#f0ece4;
  --text-2:#C4BFDB;
  --text-3:#8A84A0;
  --text-4:#5A5470;
  --accent:#A78BFA;
  --accent-2:#DDBDF7;
  --terra:#a05840;
  --gold:#908038;
  --gold-l:#a89048;
  --border:rgba(167,139,250,.15);
  --sh:0 2px 8px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.22);
  --sh-h:0 6px 20px rgba(0,0,0,.5),0 3px 8px rgba(0,0,0,.3);
}

/* ── Base ── */
body{
  font-family:'Geist',system-ui,sans-serif;
  background-color:var(--bg);
  color:var(--text-2);min-height:100vh;
  transition:background-color .3s,color .3s;
  -webkit-font-smoothing:antialiased;
}

/* ── Topbar ── */
.topbar{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;height:46px;
  background:var(--bg);
  border-top:2px solid var(--accent);
  border-bottom:1px solid var(--border);
  transition:background .3s,border-color .3s;
}
.back-link{
  font-size:.6rem;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--text-3);text-decoration:none;transition:color .2s;
}
.back-link:hover{color:var(--accent)}
.topbar-brand{
  font-family:'Playfair Display',Georgia,serif;
  font-style:italic;font-weight:700;font-size:1rem;letter-spacing:.5px;
  color:var(--accent);
  position:absolute;left:50%;transform:translateX(-50%);
}
.topbar-right{display:flex;align-items:center;gap:4px}
.saved-btn{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 10px;border-radius:2px;
  border:1.5px solid var(--border);background:none;
  font-size:.6rem;letter-spacing:.5px;color:var(--text-4);
  cursor:pointer;transition:all .2s;font-family:inherit;font-weight:600;
}
.saved-btn:hover,.saved-btn.has-saved{color:var(--accent);border-color:var(--accent)}
.theme-btn{
  background:none;border:none;cursor:pointer;
  font-size:.85rem;color:var(--text-4);padding:4px 8px;transition:color .2s;
}
.theme-btn:hover{color:var(--accent)}

/* ── Masthead ── */
.masthead{
  padding:34px 32px 26px;
  text-align:center;
  border-bottom:1px solid var(--border);
  transition:border-color .3s;
}
.mast-rule{
  display:flex;align-items:center;justify-content:center;gap:12px;
  margin:0 auto 16px;
  color:var(--text-4);font-size:.46rem;letter-spacing:4px;opacity:.6;
}
.mast-rule::before,.mast-rule::after{
  content:'';width:56px;height:1px;background:var(--border);
}
.masthead-title{
  font-family:'Playfair Display',Georgia,serif;
  font-size:clamp(2.1rem,5vw,3.4rem);
  font-weight:700;font-style:italic;
  color:var(--accent);line-height:1;
  letter-spacing:-.5px;
  margin-bottom:8px;
}
.masthead-sub{
  font-family:'Lora',Georgia,serif;font-style:italic;
  font-size:.85rem;color:var(--text-3);
  letter-spacing:.3px;
}

/* Region-tinted detail */
.detail-view[data-region="northern"]{
  --region-color:#4a7890;
  --region-tint:rgba(74,120,144,.06);
  --region-bg:#18282e;
  --region-text:#c8e0ec;
}
.detail-view[data-region="central"]{
  --region-color:#8a4030;
  --region-tint:rgba(138,64,48,.06);
  --region-bg:#281410;
  --region-text:#ecd4c8;
}
.detail-view[data-region="southern"]{
  --region-color:#7a7030;
  --region-tint:rgba(122,112,48,.06);
  --region-bg:#201e10;
  --region-text:#e4dca8;
}

/* region overrides when browsing by region */
.browse-view[data-region="northern"] .ledger-row{--region-color:#4a7890}
.browse-view[data-region="central"]  .ledger-row{--region-color:#8a4030}
.browse-view[data-region="southern"] .ledger-row{--region-color:#7a7030}

/* ── Detail region banner ── */
.detail-view[data-region] .detail-head-section{
  background:var(--region-bg);
  border-bottom:1px solid rgba(255,255,255,.08);
  position:relative;overflow:hidden;
}
.detail-view[data-region] .detail-head-section::before{
  content:'';position:absolute;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30,4 C20,14 18,26 30,54 C42,26 40,14 30,4 Z' fill='none' stroke='%23FFFFFF' stroke-width='0.8' stroke-opacity='0.06'/%3E%3Cline x1='30' y1='4' x2='30' y2='54' stroke='%23FFFFFF' stroke-width='0.4' stroke-opacity='0.04'/%3E%3C/svg%3E");
  background-size:60px 60px;pointer-events:none;
}
.detail-view[data-region] .detail-head-section>*{position:relative;z-index:1}
.detail-view[data-region] .detail-cat-label{color:var(--region-color);opacity:1}
.detail-view[data-region] .detail-title{color:var(--region-text);text-shadow:0 2px 16px rgba(0,0,0,.22)}
.detail-view[data-region] .detail-tagline{color:var(--region-text);opacity:.75}
.detail-view[data-region] .badge{background:rgba(255,255,255,.12);color:var(--region-text);border-color:rgba(255,255,255,.2)}
.detail-view[data-region] .detail-card{border-top-color:transparent}
.detail-view[data-region] .detail-back{color:var(--region-color)}

/* ── Page ── */
.page{max-width:1140px;margin:0 auto;padding:0 28px 100px}

.filter-row{
  display:flex;gap:8px;padding:14px 0;
  border-bottom:1px solid var(--border);
  align-items:center;flex-wrap:wrap;
}
.search-wrap{position:relative;flex:1;min-width:180px}
.search-icon{
  position:absolute;left:10px;top:50%;transform:translateY(-50%);
  font-size:.62rem;color:var(--text-4);pointer-events:none;
}
.search-input{
  width:100%;padding:8px 12px 8px 28px;border-radius:2px;
  border:1.5px solid var(--border);background:var(--card);
  font-size:.78rem;color:var(--text-2);font-family:inherit;
  transition:border-color .2s;
}
.search-input::placeholder{color:var(--text-4)}
.search-input:focus{outline:none;border-color:var(--accent)}
.filter-select{
  padding:8px 26px 8px 10px;border-radius:2px;
  border:1.5px solid var(--border);background:var(--card);
  font-size:.74rem;color:var(--text-2);font-family:inherit;
  cursor:pointer;-webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml,%3Csvg width='9' height='5' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0l4.5 5L9 0z' fill='%236c6860'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 8px center;
  transition:border-color .2s;
}
.filter-select:focus{outline:none;border-color:var(--accent)}
.result-count{
  padding:14px 0 6px;font-size:.54rem;
  letter-spacing:1.8px;text-transform:uppercase;color:var(--text-4);font-weight:600;
  display:flex;align-items:center;gap:10px;
}
.clear-facet{
  font-size:.54rem;letter-spacing:1.8px;text-transform:uppercase;font-weight:600;
  color:var(--accent);background:none;border:none;cursor:pointer;
  padding:0;font-family:inherit;
}
.clear-facet:hover{text-decoration:underline}

/* ── Table-of-contents wrapper ── */
.toc-wrap{max-width:820px;margin:0 auto}

/* ── Recipe ledger (cookbook TOC list) ── */
.ledger{
  display:flex;flex-direction:column;
  padding:6px 0 24px;
  scroll-margin-top:100px;
}

/* ── Ledger row ── */
.ledger-row{
  display:flex;align-items:baseline;gap:10px;
  padding:15px 2px;
  border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .15s;
  position:relative;
}
.ledger-row:hover{background:var(--region-tint,rgba(139,107,212,.05))}
.ledger-row:hover .ledger-name{color:var(--region-color,var(--accent))}
.ledger-dot{
  width:6px;height:6px;border-radius:50%;flex-shrink:0;
  margin-right:1px;opacity:.85;background:var(--region-color,var(--accent));
  align-self:center;
}
.ledger-row[data-cat="noodles"] .ledger-dot{background:#a07840}
.ledger-row[data-cat="rice"]    .ledger-dot{background:#5a7a58}
.ledger-row[data-cat="bánh"]    .ledger-dot{background:#8a4030}
.ledger-row[data-cat="sides"]   .ledger-dot{background:#4a7890}
.ledger-row[data-cat="sweets"]  .ledger-dot{background:#906858}
.ledger-row[data-cat="drinks"]  .ledger-dot{background:#487258}
.ledger-text{
  display:flex;align-items:baseline;gap:9px;min-width:0;overflow:hidden;
}
.ledger-name{
  font-family:'Lora',Georgia,serif;font-style:italic;font-weight:600;
  font-size:1.05rem;color:var(--text-1);white-space:nowrap;flex-shrink:0;
  transition:color .15s;
}
.ledger-tagline{
  font-family:'Lora',Georgia,serif;font-style:italic;
  font-size:.8rem;color:var(--text-3);flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ledger-leader{
  flex:1;min-width:20px;align-self:flex-end;
  border-bottom:2px dotted var(--text-4);opacity:.35;
  margin-bottom:6px;
}
.ledger-meta{
  display:flex;align-items:center;gap:14px;flex-shrink:0;
}
.ledger-time{
  font-family:'Lora',Georgia,serif;font-size:.82rem;color:var(--text-2);
  min-width:32px;text-align:right;
}
.cuisine-lbl{
  font-size:.44rem;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--text-4);font-weight:600;min-width:54px;text-align:right;
}
@media(max-width:640px){
  .ledger-row{flex-wrap:wrap;row-gap:6px}
  .ledger-leader{display:none}
  .ledger-text{width:100%;flex-wrap:wrap}
  .ledger-tagline{white-space:normal}
  .ledger-meta{width:100%;justify-content:space-between;padding-left:16px}
  .cuisine-lbl{text-align:left}
}
.heart-btn{
  background:none;border:none;cursor:pointer;
  font-size:.9rem;line-height:1;
  min-width:44px;min-height:44px;padding:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-4);transition:all .18s;flex-shrink:0;
}
.heart-btn:hover{color:var(--terra);transform:scale(1.2)}
.heart-btn.saved{color:var(--terra)}

/* ── Category section headers ── */
.cat-section-head{
  font-family:'Lora',Georgia,serif;
  font-size:1.5rem;font-weight:600;font-style:italic;
  color:var(--terra);
  padding:36px 2px 8px;
  letter-spacing:-.3px;
  display:flex;align-items:center;gap:14px;
}
.cat-section-icon{font-style:normal;font-size:1.15rem;line-height:1}
.cat-section-head::after{
  content:'';flex:1;height:1px;background:var(--border);
}
.cat-section-head:first-child{ padding-top:20px; }

.card-img-strip{
  width:100%;height:130px;object-fit:cover;display:block;
  border-radius:5px 5px 0 0;
}
.region-badge{
  font-size:.5rem;letter-spacing:1.2px;font-style:italic;
  color:var(--accent);font-weight:600;
}

/* ── Empty state ── */
.empty-state{
  text-align:center;padding:80px 20px;
  color:var(--text-4);grid-column:1/-1;
}
.empty-state p{font-family:Georgia,serif;font-style:italic;font-size:.9rem}

/* ── Views ── */
.detail-view{display:none}
.detail-view.active{display:block}
.browse-view{display:block}
.browse-view.hidden{display:none}

/* ── Explore panels (region map + category tiles) ── */
.explore-body{
  max-width:1060px;margin:0 auto;padding:32px 28px 44px;
  display:grid;grid-template-columns:1fr 1fr;gap:48px;
}
@media(max-width:720px){.explore-body{grid-template-columns:1fr;gap:32px;padding:28px 16px 60px}}

.explore-panel{
  background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:28px 24px;box-shadow:var(--sh);
}
.explore-panel-label{
  font-size:.52rem;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--text-4);font-weight:700;margin-bottom:20px;
  display:flex;align-items:center;gap:10px;
}
.explore-panel-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* Region map panel */
.map-and-list{display:flex;gap:28px;align-items:flex-start}
@media(max-width:540px){.map-and-list{gap:18px}}

.viet-map-svg{
  flex-shrink:0;width:112px;height:auto;
}
.viet-region{
  transition:opacity .18s;cursor:pointer;
  stroke:#F0EAD8;stroke-width:1.2;
}
:root[data-theme="dark"] .viet-region{stroke:#111A0E}
.viet-region:hover{opacity:.7}
.map-region-north{fill:#7aaab8}
.map-region-central{fill:url(#centralGradLight)}
.map-region-south{fill:#b0a860}
:root[data-theme="dark"] .map-region-north{fill:#2a4858}
:root[data-theme="dark"] .map-region-central{fill:url(#centralGradDark)}
:root[data-theme="dark"] .map-region-south{fill:#605830}

.region-list{display:flex;flex-direction:column;flex:1}
.region-btn{
  display:flex;align-items:center;gap:14px;
  padding:14px 0 14px 16px;
  border:none;background:none;cursor:pointer;font-family:inherit;
  text-align:left;width:100%;
  border-bottom:1px solid var(--border);
  border-left:3px solid transparent;
  transition:background .15s,border-left-color .15s;
  position:relative;
}
.region-btn:first-child{border-top:1px solid var(--border)}
.region-btn:hover{background:rgba(60,60,60,.03)}
.region-btn.rn:hover{border-left-color:#4a7890;background:rgba(74,120,144,.06)}
.region-btn.rc:hover{border-left-color:#8a4030;background:rgba(138,64,48,.06)}
.region-btn.rs:hover{border-left-color:#7a7030;background:rgba(122,112,48,.06)}

.region-info{flex:1;min-width:0}
.region-viet{
  font-family:'Playfair Display',Georgia,serif;
  font-style:italic;font-size:1.12rem;color:var(--text-1);font-weight:700;
  display:block;line-height:1.15;margin-bottom:3px;
}
.region-eng{
  font-size:.46rem;letter-spacing:2px;text-transform:uppercase;
  color:var(--text-4);font-weight:700;
}
.region-count-badge{
  font-family:'Playfair Display',Georgia,serif;font-style:italic;
  font-size:1.7rem;line-height:1;font-weight:700;
  flex-shrink:0;
}
.region-btn.rn .region-count-badge{color:#4a7890}
.region-btn.rc .region-count-badge{color:#8a4030}
.region-btn.rs .region-count-badge{color:#7a7030}
:root[data-theme="dark"] .region-btn.rn .region-count-badge{color:#6a9ab0}
:root[data-theme="dark"] .region-btn.rc .region-count-badge{color:#a86050}
:root[data-theme="dark"] .region-btn.rs .region-count-badge{color:#989048}

/* Category tiles */
.cat-tiles{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
}
@media(max-width:480px){.cat-tiles{grid-template-columns:repeat(2,1fr)}}
.cat-tile{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:22px 10px 16px;border-radius:5px;border:none;cursor:pointer;
  transition:transform .15s,box-shadow .15s,filter .15s;
  min-height:100px;position:relative;overflow:hidden;
  font-family:inherit;
  box-shadow:0 1px 4px rgba(60,40,0,.07);
  border-top:3px solid transparent;
}
.cat-tile:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(60,40,0,.12);filter:brightness(.97)}
.cat-tile[data-cat="noodles"]{border-top-color:#a07840}
.cat-tile[data-cat="rice"]   {border-top-color:#5a7a58}
.cat-tile[data-cat="bánh"]   {border-top-color:#8a4030}
.cat-tile[data-cat="sides"]  {border-top-color:#4a7890}
.cat-tile[data-cat="sweets"] {border-top-color:#906858}
.cat-tile[data-cat="drinks"] {border-top-color:#487258}
.cat-tile-icon{
  font-size:1.7rem;margin-bottom:9px;line-height:1;
}
.cat-tile-name{
  font-size:.46rem;letter-spacing:2px;text-transform:uppercase;
  font-weight:700;color:rgba(42,26,8,.72);
}
.cat-tile-count{
  font-family:'Playfair Display',Georgia,serif;font-style:italic;
  font-size:.8rem;color:rgba(42,26,8,.42);margin-top:2px;
}
:root[data-theme="dark"] .cat-tile-name{color:rgba(238,232,208,.75)}
:root[data-theme="dark"] .cat-tile-count{color:rgba(238,232,208,.4)}

/* ── Detail ── */
.detail-back{
  display:inline-flex;align-items:center;gap:5px;
  font-size:.54rem;letter-spacing:1.6px;text-transform:uppercase;font-weight:600;
  color:var(--text-4);cursor:pointer;padding:20px 0 14px;
  transition:color .2s;background:none;border:none;font-family:inherit;
}
.detail-back:hover{color:var(--region-color,var(--accent))}

.detail-card{
  background:var(--card);border:1px solid var(--border);
  border-top:3px solid var(--region-color,var(--terra));
  border-radius:4px;overflow:hidden;box-shadow:var(--sh-h);
}
.detail-img-strip{
  width:100%;height:240px;object-fit:cover;display:block;
}
.detail-hero-deco{
  width:100%;padding:28px 32px 20px;
  display:flex;align-items:center;gap:16px;
  border-bottom:1px solid var(--border);
  background:var(--card);
}
.hero-deco-line{flex:1;height:1px;background:var(--border)}
.hero-deco-mark{
  font-size:1.4rem;color:var(--region-color,var(--accent));opacity:.5;
  line-height:1;
}
.detail-head-section{
  padding:28px 32px 24px;
  border-bottom:1px solid var(--border);
}
.detail-cat-label{
  font-size:.5rem;letter-spacing:2px;text-transform:uppercase;
  color:var(--region-color,var(--terra));font-weight:700;margin-bottom:12px;
}
.detail-title{
  font-family:'Lora',Georgia,serif;
  font-size:clamp(1.7rem,3.5vw,2.6rem);
  font-weight:600;font-style:italic;color:var(--text-1);
  line-height:1.1;letter-spacing:-.3px;margin-bottom:8px;
}
.detail-tagline{
  font-style:italic;
  font-size:.92rem;color:var(--text-3);margin-bottom:12px;
}
.detail-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:0}
.badge{
  font-size:.54rem;letter-spacing:1px;text-transform:uppercase;
  color:var(--terra);border:1.5px solid var(--terra);
  padding:3px 9px;border-radius:2px;opacity:.75;
}
/* Section divider */
.orn-rule{
  display:flex;align-items:center;gap:14px;
  padding:0 32px;margin:20px 0;
  color:var(--accent);opacity:.5;font-size:.45rem;letter-spacing:4px;
}
.orn-rule::before,.orn-rule::after{
  content:'';flex:1;height:1px;background:var(--border);
}
.detail-body{
  display:grid;grid-template-columns:2fr 1fr;gap:0;
}
@media(max-width:640px){.detail-body{grid-template-columns:1fr}}
.detail-main{
  padding:28px 32px 36px;
  border-right:1px solid var(--border);
}
@media(max-width:640px){.detail-main{border-right:none;border-bottom:1px solid var(--border);padding:24px 20px}}
.detail-sidebar{padding:28px 24px 36px}
@media(max-width:640px){.detail-sidebar{padding:24px 20px}}

.detail-desc{
  font-family:'Lora',Georgia,serif;
  font-size:.92rem;color:var(--text-2);line-height:1.9;margin-bottom:20px;
}
/* ── Recipe info strip (serves/time) ── */
.recipe-info-strip{
  display:flex;border:1px solid var(--border);border-radius:3px;
  overflow:hidden;margin-bottom:28px;
}
.ri-item{
  flex:1;display:flex;flex-direction:column;align-items:center;
  padding:13px 6px 10px;border-right:1px solid var(--border);text-align:center;
}
.ri-item:last-child{border-right:none}
.ri-val{
  font-family:'Lora',Georgia,serif;font-size:.96rem;
  font-weight:600;color:var(--text-1);line-height:1;
}
.ri-key{
  font-size:.42rem;letter-spacing:1.8px;text-transform:uppercase;
  color:var(--text-4);font-weight:700;margin-top:5px;
}
.det-section{margin-bottom:28px}
.det-label{
  font-size:.5rem;letter-spacing:2px;text-transform:uppercase;
  color:var(--region-color,var(--accent));margin-bottom:10px;font-weight:700;
  display:flex;align-items:center;gap:10px;
}
.det-label::after{content:'';flex:1;height:1px;background:var(--border)}
/* Ingredient section container */
.ing-section .ing-list{
  background:rgba(90,122,88,.04);border:1px solid rgba(90,122,88,.12);
  border-radius:3px;padding:4px 0;
}
:root[data-theme="dark"] .ing-section .ing-list{
  background:rgba(90,122,88,.06);border-color:rgba(90,122,88,.14);
}
.ing-list{list-style:none}
.ing-list li{
  font-family:'Lora',Georgia,serif;
  font-size:.88rem;color:var(--text-2);
  padding:7px 14px 7px 32px;position:relative;
  line-height:1.6;border-bottom:1px solid rgba(90,122,88,.08);
}
.ing-list li:last-child{border-bottom:none}
.ing-list li::before{
  content:'–';position:absolute;left:14px;top:7px;
  color:var(--region-color,var(--accent));opacity:.6;
  font-style:normal;font-weight:400;
}
.step-list{list-style:none;counter-reset:steps;display:flex;flex-direction:column;gap:0}
.step-list li{
  font-family:'Lora',Georgia,serif;
  font-size:.9rem;color:var(--text-2);
  padding:16px 16px 16px 54px;position:relative;
  line-height:1.85;counter-increment:steps;
  border-bottom:1px solid var(--border);
  transition:background .15s;
}
.step-list li:hover{background:var(--region-tint,rgba(200,136,10,.04))}
.step-list li:last-child{border-bottom:none}
.step-list li::before{
  content:counter(steps);position:absolute;left:12px;top:16px;
  width:26px;height:26px;border-radius:50%;
  background:var(--region-color,var(--accent));color:#fff;
  font-family:'Lora',Georgia,serif;font-style:normal;font-size:.72rem;font-weight:600;
  line-height:26px;text-align:center;opacity:.9;
}
.tips-wrap{
  padding:16px 20px;
  background:var(--region-tint,rgba(200,136,10,.06));
  border-left:3px solid var(--region-color,var(--accent));border-radius:0 4px 4px 0;
}
.tips-text{
  font-family:'Lora',Georgia,serif;font-style:italic;
  font-size:.88rem;color:var(--text-2);line-height:1.9;
}

/* ── Detail nav (prev/next) ── */
.detail-nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 32px;border-top:1px solid var(--border);
  gap:12px;
}
.detail-nav-btn{
  display:flex;align-items:center;gap:8px;
  background:none;border:1px solid var(--border);border-radius:2px;
  padding:9px 16px;cursor:pointer;font-family:inherit;
  font-size:.62rem;letter-spacing:.5px;color:var(--text-3);
  transition:all .18s;max-width:45%;text-align:left;
}
.detail-nav-btn:hover{color:var(--region-color,var(--accent));border-color:var(--region-color,var(--accent))}
.detail-nav-btn.next{text-align:right;margin-left:auto}
.detail-nav-label{font-size:.48rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-4);display:block;margin-bottom:2px}
.detail-nav-name{font-size:.78rem;font-family:'Playfair Display',Georgia,serif;font-style:italic;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}

/* ── Related recipes ── */
.related-section{padding:32px 32px 36px;border-top:1px solid var(--border)}
@media(max-width:640px){.related-section{padding:24px 20px 32px}}
.related-group{margin-bottom:32px}
.related-group:last-child{margin-bottom:0}
.related-lbl{
  font-size:.52rem;letter-spacing:2px;text-transform:uppercase;
  color:var(--text-4);font-weight:700;margin-bottom:14px;
  display:flex;align-items:center;gap:10px;
}
.related-lbl::after{content:'';flex:1;height:1px;background:var(--border)}
.related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.related-card{
  padding:14px 16px;background:var(--card);
  border:1px solid var(--border);
  border-left:3px solid var(--region-color,var(--accent));
  cursor:pointer;transition:all .15s;
}
.related-card:hover{background:var(--region-tint,rgba(200,136,10,.05));border-left-width:4px}
.related-name{
  font-size:.88rem;font-family:'Playfair Display',Georgia,serif;
  font-weight:700;color:var(--text-1);margin-bottom:5px;line-height:1.3;
}
.related-meta{font-size:.6rem;color:var(--text-4);letter-spacing:.3px}
/* Sidebar */
.sb-inner{position:sticky;top:calc(46px + 24px)}
.sb-label{
  font-size:.52rem;letter-spacing:2px;text-transform:uppercase;
  color:var(--region-color,var(--accent));margin-bottom:10px;font-weight:700;
  display:flex;align-items:center;gap:10px;
}
.sb-label::after{content:'';flex:1;height:1px;background:var(--border)}
.sb-stat{
  display:flex;justify-content:space-between;
  padding:8px 0;border-bottom:1px solid var(--border);font-size:.78rem;
}
.sb-stat:last-of-type{border-bottom:none}
.sb-key{color:var(--text-3);text-transform:capitalize}
.sb-val{color:var(--text-1);font-weight:500;text-transform:capitalize}
.save-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  margin-top:16px;padding:10px;width:100%;
  border:1.5px solid var(--border);border-radius:2px;
  background:none;font-size:.54rem;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;
  color:var(--text-3);cursor:pointer;transition:all .2s;font-family:inherit;
}
.save-btn:hover{border-color:var(--region-color,var(--terra));color:var(--region-color,var(--terra))}
.save-btn.saved{border-color:var(--region-color,var(--terra));color:var(--region-color,var(--terra));background:var(--region-tint,rgba(184,88,40,.07))}
.print-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  margin-top:8px;padding:8px;width:100%;
  border:1px solid var(--border);border-radius:2px;
  background:none;font-size:.52rem;letter-spacing:1.2px;text-transform:uppercase;font-weight:600;
  color:var(--text-4);cursor:pointer;transition:all .2s;font-family:inherit;
}
.print-btn:hover{border-color:var(--text-3);color:var(--text-2)}
/* Serving scaler */
.scaler-wrap{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.scaler-label{
  font-size:.5rem;letter-spacing:1.8px;text-transform:uppercase;
  color:var(--text-4);font-weight:700;margin-bottom:8px;
}
.scale-btns{display:flex;gap:6px}
.scale-btn{
  flex:1;padding:0;min-height:44px;
  border:1px solid var(--border);border-radius:2px;
  background:none;font-size:.72rem;font-weight:600;
  color:var(--text-3);cursor:pointer;transition:all .15s;font-family:inherit;
}
.scale-btn:hover{border-color:var(--accent);color:var(--accent)}
.scale-btn.active{border-color:var(--region-color,var(--accent));color:var(--region-color,var(--accent));background:var(--region-tint,rgba(90,122,88,.08))}

/* ── Print ── */
@media print{
  .topbar,.masthead,.browse-view,.detail-back,.detail-nav,
  .save-btn,.print-btn,.scaler-wrap,.related-section,
  [id="savedBadge"],[id="themeBtn"]{display:none!important}
  .detail-view{display:block!important}
  .detail-card{border:none;box-shadow:none;border-left:none;border-top:none}
  .detail-head-section{padding:0 0 16px}
  .detail-sidebar{display:none}
  .detail-main{width:100%}
  .detail-body{display:block}
}

/* ── Footer ── */
.page-footer{
  padding:52px 0 12px;text-align:center;
  font-size:.52rem;letter-spacing:2px;text-transform:uppercase;color:var(--text-4);font-weight:600;
}
.page-footer::before{
  content:'✦';display:block;color:rgba(90,122,88,.5);font-size:.5rem;margin-bottom:18px;letter-spacing:6px;
}
.page-footer a{color:var(--text-4);text-decoration:none;transition:color .2s}
.page-footer a:hover{color:var(--accent)}

/* ── Animations ── */
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card-in{animation:cardIn .26s ease forwards}

/* ── Responsive ── */
@media(max-width:540px){
  .topbar{padding-left:16px;padding-right:16px}
  .page{padding:0 16px 80px}
  .masthead{padding:12px 16px 10px}
  .mast-rule::before,.mast-rule::after{width:40px}
  .detail-head-section,.orn-rule{padding-left:18px;padding-right:18px}
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<div class="topbar">
  <a href="../../index.html" class="back-link">&larr; Portfolio</a>
  <button class="topbar-brand" onclick="goHome()" aria-label="Back to home" style="cursor:pointer;background:none;border:none;font-size:.7rem;color:var(--text-4);letter-spacing:1px;font-family:inherit;transition:color .2s" onmouseenter="this.style.color='var(--accent)'" onmouseleave="this.style.color='var(--text-4)'">&#8962;</button>
  <div class="topbar-right">
    <button class="saved-btn" id="savedBadge" onclick="filterSaved()">
      <span id="savedHeart">&#9825;</span>&thinsp;<span id="savedCount">0</span>
    </button>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" aria-label="Toggle theme">◐</button>
  </div>
</div>

<div class="browse-view" id="browseView">

  <div class="masthead">
    <div class="mast-rule">&#10022;</div>
    <div class="masthead-title">Cơm Nhà</div>
    <p class="masthead-sub">175 Vietnamese recipes, cooked from scratch</p>
  </div>

  <div class="explore-body">
    <!-- A: Region map -->
    <div class="explore-panel">
      <div class="explore-panel-label">Browse by region</div>
      <div class="map-and-list">
        <svg class="viet-map-svg" viewBox="0 0 68 138" xmlns="http://www.w3.org/2000/svg">
          <!--
            Real lat/lon → SVG: x=(lon-102)*9, y=(23.5-lat)*9
            N/C boundary at y≈60 (17°N, narrow waist), C/S at y≈112 (11°N)
            Central region uses a gradient: terracotta (top) → gold (bottom)
          -->
          <defs>
            <!-- light mode gradient: terracotta (top) → harvest gold (bottom) -->
            <linearGradient id="centralGradLight" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stop-color="#b06858"/>
              <stop offset="55%"  stop-color="#a08048"/>
              <stop offset="100%" stop-color="#b0a060"/>
            </linearGradient>
            <!-- dark mode gradient -->
            <linearGradient id="centralGradDark" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stop-color="#583028"/>
              <stop offset="55%"  stop-color="#504028"/>
              <stop offset="100%" stop-color="#504820"/>
            </linearGradient>
          </defs>

          <!-- Northern: wide  -  Red River Delta, Gulf of Tonkin juts right -->
          <path class="viet-region map-region-north"
            onclick="browseRegion('northern')"
            d="M4,9 L18,2 L35,1 L43,7
               L53,15 L56,19
               L49,26 L43,32
               L37,40 L41,50 L48,60
               L41,60
               L32,54 L25,48 L19,41
               L13,30 L7,18 Z">
            <title>Miền Bắc</title>
          </path>

          <!-- Central: narrow waist, east coast bulges far right at Quy Nhơn (65,87) -->
          <path class="viet-region map-region-central"
            onclick="browseRegion('central')"
            d="M41,60 L48,60
               L52,64 L58,68
               L64,80 L65,87
               L62,100 L59,110 L56,112
               L23,112
               L30,108 L42,105
               L48,95 L50,86
               L46,78 L44,70 L41,64 Z">
            <title>Miền Trung</title>
          </path>

          <!-- Southern: Mekong Delta fan, Gulf of Thailand west coast, Cà Mau tip -->
          <path class="viet-region map-region-south"
            onclick="browseRegion('southern')"
            d="M23,112 L56,112
               L50,116 L44,120 L40,122
               L32,122 L26,122
               L24,128 L23,135
               L19,130 L17,124
               L18,118 L21,114 Z">
            <title>Miền Nam</title>
          </path>
        </svg>
        <div class="region-list" id="regionList">
          <!-- populated by JS -->
        </div>
      </div>
    </div>

    <!-- B: Category tiles -->
    <div class="explore-panel">
      <div class="explore-panel-label">Browse by category</div>
      <div class="cat-tiles" id="catTiles">
        <!-- populated by JS -->
      </div>
    </div>
  </div>

  <div class="page">
    <div class="toc-wrap">
      <div class="filter-row">
        <div class="search-wrap">
          <span class="search-icon">&#10022;</span>
          <input type="search" class="search-input" id="searchInput"
            aria-label="Search recipes by name or ingredients"
            placeholder="Search by name or ingredients (e.g. pork, lemongrass)..." oninput="onSearch()">
        </div>
        <select class="filter-select" id="difficultyFilter" onchange="applyFilters()">
          <option value="">Any difficulty</option>
          <option value="easy">Easy</option>
          <option value="moderate">Moderate</option>
          <option value="involved">Involved</option>
        </select>
      </div>

      <div class="result-count" id="resultCount"></div>
      <div class="ledger" id="cardGrid"></div>
    </div>

    <div class="page-footer">
      <a href="../../index.html" class="back-link">&larr; Portfolio</a>
    </div>
  </div>

</div><!-- /browse-view -->

<div class="detail-view" id="detailView">
  <div class="page">
    <button class="detail-back" onclick="showBrowse()">&larr; Back to Recipes</button>
    <div id="detailContent"></div>
    <div id="detailNav"></div>
  </div>
</div>

<script>
const LS_FAV   = 'from-scratch-favorites';
const LS_THEME = 'from-scratch-theme';

let allRecipes = [], activeCat = 'all', savedIds = new Set(), searchTimer = null;

/* ── Theme ── */
function toggleTheme(){
  const h = document.documentElement;
  const n = h.getAttribute('data-theme')==='dark'?'light':'dark';
  h.setAttribute('data-theme',n);
  localStorage.setItem(LS_THEME,n);
  updateThemeBtn(n);
  // Re-render tiles so pastel vs dark colours update
  if(allRecipes.length) renderExplore();
}
function updateThemeBtn(t){}

/* ── Favorites ── */
function loadSaved(){
  try{ savedIds=new Set(JSON.parse(localStorage.getItem(LS_FAV)||'[]')); }
  catch{ savedIds=new Set(); }
}
function persistSaved(){ localStorage.setItem(LS_FAV,JSON.stringify([...savedIds])); }
function toggleFavorite(id,e){
  if(e) e.stopPropagation();
  savedIds.has(id)?savedIds.delete(id):savedIds.add(id);
  persistSaved(); updateSavedBadge();
  document.querySelectorAll('.heart-btn[data-id="'+id+'"]').forEach(b=>{
    b.classList.toggle('saved',savedIds.has(id));
    b.innerHTML=savedIds.has(id)?'&#9829;':'&#9825;';
  });
  const sb=document.getElementById('detailSaveBtn');
  if(sb&&parseInt(sb.dataset.id)===id){
    sb.classList.toggle('saved',savedIds.has(id));
    sb.innerHTML=savedIds.has(id)?'&#9829;&ensp;Saved':'&#9825;&ensp;Save Recipe';
  }
  if(activeCat==='saved'&&!savedIds.has(id)) applyFilters();
}
function updateSavedBadge(){
  const n=savedIds.size;
  document.getElementById('savedCount').textContent=n;
  document.getElementById('savedHeart').innerHTML=n>0?'&#9829;':'&#9825;';
  document.getElementById('savedBadge').classList.toggle('has-saved',n>0);
}

/* ── Filters ── */
function filterSaved(){
  activeCat='saved';
  delete document.getElementById('browseView').dataset.region;
  showBrowse();
  applyFilters();
}
function clearFacet(){
  activeCat='all';
  delete document.getElementById('browseView').dataset.region;
  applyFilters();
}
function onSearch(){ clearTimeout(searchTimer); searchTimer=setTimeout(applyFilters,150); }
function applyFilters(){
  const raw=(document.getElementById('searchInput').value||'').toLowerCase().trim();
  const terms=raw?raw.split(',').map(t=>t.trim()).filter(Boolean):[];
  const region=document.getElementById('browseView').dataset.region||'';
  const dif=document.getElementById('difficultyFilter').value;
  const out=allRecipes.filter(r=>{
    if(activeCat==='saved'){if(!savedIds.has(r.id))return false;}
    else if(activeCat!=='all'){if(r.category!==activeCat)return false;}
    if(region&&r.cuisine!==region)return false;
    if(dif&&r.difficulty!==dif)return false;
    if(terms.length){
      const h=[r.name,r.tagline,r.ingredients,r.cuisine,r.category].join(' ').toLowerCase();
      if(!terms.every(t=>h.includes(t)))return false;
    }
    return true;
  });
  renderCards(out);
  const countText=out.length+(out.length===1?' recipe':' recipes');
  const facet=activeCat==='saved'?'saved':activeCat!=='all'?(CAT_LABEL[activeCat]||activeCat):region?regionLabel(region):null;
  const rc=document.getElementById('resultCount');
  rc.innerHTML=facet
    ?`${countText}${facet==='saved'?' saved':' in '+facet} <button class="clear-facet" type="button" onclick="clearFacet()">Clear &times;</button>`
    :countText;
}

/* ── Helpers ── */
const CAT_GRAD={
  light:{
    noodles:'#eae8e2', rice:'#e4e8e0', 'bánh':'#eae6e0',
    sides:'#e2e8e0', sweets:'#eee6e2', drinks:'#e2e8e4',
  },
  dark:{
    noodles:'#242220', rice:'#202420', 'bánh':'#242218',
    sides:'#1e2218', sweets:'#28201e', drinks:'#1e2420',
  },
};
const CAT_ICON={
  noodles:'🍜', rice:'🍚', 'bánh':'🥖', sides:'🥬', sweets:'🍮', drinks:'🍵'
};
function catGrad(c){
  const t=document.documentElement.getAttribute('data-theme')||'light';
  return (CAT_GRAD[t]||CAT_GRAD.light)[c]||'#ccc';
}
function regionLabel(c){return{northern:'Miền Bắc',central:'Miền Trung',southern:'Miền Nam'}[c]||c;}
function diffStars(d){
  const n={easy:1,moderate:2,involved:3}[d]||1;
  return [1,2,3].map(i=>`<span class="d-star${i<=n?' on':''}">&#9733;</span>`).join('');
}
function fmtTime(m){
  if(!m)return' - ';
  if(m>=60){const h=Math.floor(m/60),r=m%60;return h+'h'+(r?'\u2009'+r+'m':'');}
  return m+'m';
}

/* ── Render cards ── */
const CAT_ORDER=['noodles','rice','bánh','sides','sweets','drinks'];
const CAT_LABEL={noodles:'Noodles',rice:'Rice','bánh':'Bánh',sides:'Sides',sweets:'Sweets',drinks:'Drinks'};

function renderCards(list){
  const g=document.getElementById('cardGrid');
  if(!list.length){
    g.innerHTML='<div class="empty-state"><p>No recipes found.<br>Try adjusting your filters.</p></div>';
    return;
  }
  const grouped = activeCat==='all' && !document.getElementById('searchInput').value.trim()
                  && !document.getElementById('browseView').dataset.region
                  && !document.getElementById('difficultyFilter').value;
  let html='';
  if(grouped){
    CAT_ORDER.forEach(cat=>{
      const sub=list.filter(r=>r.category===cat);
      if(!sub.length)return;
      html+=`<div class="cat-section-head"><span class="cat-section-icon">${CAT_ICON[cat]||''}</span>${CAT_LABEL[cat]||cat}</div>`;
      html+=sub.map((r,i)=>recipeRow(r,i)).join('');
    });
  } else {
    html=list.map((r,i)=>recipeRow(r,i)).join('');
  }
  g.innerHTML=html;
}

function recipeRow(r,i){
  const sv=savedIds.has(r.id);
  const tot=r.prep_time_min+r.cook_time_min;
  return `<div class="ledger-row card-in" data-cat="${r.category}" style="animation-delay:${i*.025}s" onclick="showDetail(${r.id})">
    <span class="ledger-dot"></span>
    <div class="ledger-text">
      <span class="ledger-name">${r.name}</span>
      <span class="ledger-tagline">${r.tagline}</span>
    </div>
    <span class="ledger-leader" aria-hidden="true"></span>
    <div class="ledger-meta">
      <span class="ledger-time">${fmtTime(tot)}</span>
      <span class="cuisine-lbl">${regionLabel(r.cuisine)}</span>
      <button class="heart-btn${sv?' saved':''}" data-id="${r.id}"
        onclick="toggleFavorite(${r.id},event)">${sv?'&#9829;':'&#9825;'}</button>
    </div>
  </div>`;
}

/* ── Serving scaler ── */
let currentScale = 1;

function scaleAmount(str, factor){
  if(factor===1) return str;
  return str.replace(/^(\d+\/\d+|\d+\.?\d*)/, m => {
    let n;
    if(m.includes('/')) { const [a,b]=m.split('/'); n=parseFloat(a)/parseFloat(b); }
    else { n=parseFloat(m); }
    const scaled = n * factor;
    if(scaled === Math.round(scaled)) return scaled.toString();
    const r = Math.round(scaled*4)/4;
    return r.toString().replace('.25','¼').replace('.5','½').replace('.75','¾');
  });
}

function setScale(n){
  currentScale = n;
  document.querySelectorAll('.scale-btn').forEach(b=>b.classList.toggle('active',parseInt(b.dataset.scale)===n));
  const list = document.getElementById('scaledIngList');
  if(!list) return;
  const base = JSON.parse(list.dataset.base);
  list.innerHTML = base.map(i=>`<li>${scaleAmount(i, n)}</li>`).join('');
}

/* ── Detail ── */
function relatedCard(rx){
  const tot=rx.prep_time_min+rx.cook_time_min;
  return `<div class="related-card" onclick="showDetail(${rx.id})">
    <div class="related-name">${rx.name}</div>
    <div class="related-meta">${regionLabel(rx.cuisine)} &middot; ${fmtTime(tot)}</div>
  </div>`;
}

function showDetail(id){
  const r=allRecipes.find(x=>x.id===id); if(!r)return;
  currentScale = 1;
  const sv=savedIds.has(r.id);
  const ings=r.ingredients.split('\n').map(l=>l.replace(/^-\s*/,'').trim()).filter(Boolean);
  const steps=r.instructions.split('\n').map(l=>l.replace(/^\d+\.\s*/,'').trim()).filter(Boolean);
  const dBadges=r.dietary.length?r.dietary.map(d=>`<span class="badge">${d}</span>`).join(''):'';
  const tipsHtml=r.tips?`<div class="det-section">
    <div class="det-label">Tips</div>
    <div class="tips-wrap"><p class="tips-text">${r.tips}</p></div>
  </div>`:'';
  const tot=r.prep_time_min+r.cook_time_min;

  // Related recipes
  const sameCat=allRecipes.filter(x=>x.id!==r.id&&x.category===r.category).slice(0,4);
  const sameReg=allRecipes.filter(x=>x.id!==r.id&&x.cuisine===r.cuisine&&x.category!==r.category).slice(0,4);
  const relatedHtml=`<div class="related-section">
    ${sameCat.length?`<div class="related-group">
      <div class="related-lbl">More ${CAT_LABEL[r.category]||r.category}</div>
      <div class="related-grid">${sameCat.map(relatedCard).join('')}</div>
    </div>`:''}
    ${sameReg.length?`<div class="related-group">
      <div class="related-lbl">More from ${regionLabel(r.cuisine)}</div>
      <div class="related-grid">${sameReg.map(relatedCard).join('')}</div>
    </div>`:''}
  </div>`;

  const ingBase=JSON.stringify(ings).replace(/"/g,'&quot;');
  const detailImg=r.photo?`<img class="detail-img-strip" src="${r.photo}" alt="${r.name}" loading="lazy">`
    :`<div class="detail-hero-deco"><div class="hero-deco-line"></div><span class="hero-deco-mark">&#10022;</span><div class="hero-deco-line"></div><span class="hero-deco-mark">&#10022;</span><div class="hero-deco-line"></div></div>`;
  document.getElementById('detailContent').innerHTML=`
    <div class="detail-card">
      ${detailImg}<div class="detail-head-section">
        <div class="detail-cat-label">${r.category}</div>
        <h1 class="detail-title">${r.name}</h1>
        <p class="detail-tagline">${r.tagline}</p>
        ${dBadges?'<div class="detail-badges">'+dBadges+'</div>':''}
      </div>
      <div class="orn-rule">&#10022;</div>
      <div class="detail-body">
        <div class="detail-main">
          <p class="detail-desc">${r.description}</p>
          <div class="recipe-info-strip">
            <div class="ri-item"><span class="ri-val">${r.servings}</span><span class="ri-key">Serves</span></div>
            <div class="ri-item"><span class="ri-val">${r.prep_time_min>0?r.prep_time_min+'m':'—'}</span><span class="ri-key">Prep</span></div>
            <div class="ri-item"><span class="ri-val">${r.cook_time_min>0?r.cook_time_min+'m':'—'}</span><span class="ri-key">Cook</span></div>
            <div class="ri-item"><span class="ri-val">${fmtTime(tot)}</span><span class="ri-key">Total</span></div>
          </div>
          <div class="det-section ing-section">
            <div class="det-label">Ingredients <span style="font-style:italic;font-weight:400;font-size:.78em;opacity:.6;text-transform:none;letter-spacing:0">${ings.length} items</span></div>
            <ul class="ing-list" id="scaledIngList" data-base="${ingBase}">${ings.map(i=>`<li>${i}</li>`).join('')}</ul>
          </div>
          <div class="det-section">
            <div class="det-label">Instructions <span style="font-style:italic;font-weight:400;font-size:.78em;opacity:.6;text-transform:none;letter-spacing:0">${steps.length} steps</span></div>
            <ol class="step-list">${steps.map(s=>`<li>${s}</li>`).join('')}</ol>
          </div>
          ${tipsHtml}
        </div>
        <div class="detail-sidebar">
          <div class="sb-inner">
            <div class="sb-label">Quick Facts</div>
            <div class="sb-stat"><span class="sb-key">Prep</span><span class="sb-val">${r.prep_time_min} min</span></div>
            <div class="sb-stat"><span class="sb-key">Cook</span><span class="sb-val">${r.cook_time_min>0?r.cook_time_min+' min':'—'}</span></div>
            <div class="sb-stat"><span class="sb-key">Total</span><span class="sb-val">${fmtTime(tot)}</span></div>
            <div class="sb-stat"><span class="sb-key">Serves</span><span class="sb-val">${r.servings}</span></div>
            <div class="sb-stat"><span class="sb-key">Difficulty</span><span class="sb-val">${r.difficulty}</span></div>
            <div class="sb-stat"><span class="sb-key">Region</span><span class="sb-val">${regionLabel(r.cuisine)}</span></div>
            <div class="sb-stat"><span class="sb-key">Source</span><span class="sb-val">${r.source}</span></div>
            <div class="scaler-wrap">
              <div class="scaler-label">Serving size</div>
              <div class="scale-btns">
                <button class="scale-btn active" data-scale="1" onclick="setScale(1)">&times;1</button>
                <button class="scale-btn" data-scale="2" onclick="setScale(2)">&times;2</button>
                <button class="scale-btn" data-scale="4" onclick="setScale(4)">&times;4</button>
              </div>
            </div>
            <button class="save-btn${sv?' saved':''}" id="detailSaveBtn" data-id="${r.id}"
              onclick="toggleFavorite(${r.id},event)">
              ${sv?'&#9829;&ensp;Saved':'&#9825;&ensp;Save Recipe'}
            </button>
            <button class="print-btn" onclick="window.print()">&#9112;&ensp;Print Recipe</button>
          </div>
        </div>
      </div>
      ${relatedHtml}
    </div>`;

  // Prev / next within same category
  const peers=allRecipes.filter(x=>x.category===r.category);
  const idx=peers.findIndex(x=>x.id===r.id);
  const prev=peers[idx-1], next=peers[idx+1];
  document.getElementById('detailNav').innerHTML=`
    <div class="detail-nav">
      ${prev?`<button class="detail-nav-btn" onclick="showDetail(${prev.id})">
        <span>&#8592;</span>
        <span><span class="detail-nav-label">Previous</span>
        <span class="detail-nav-name">${prev.name}</span></span>
      </button>`:'<span></span>'}
      ${next?`<button class="detail-nav-btn next" onclick="showDetail(${next.id})">
        <span><span class="detail-nav-label">Next</span>
        <span class="detail-nav-name">${next.name}</span></span>
        <span>&#8594;</span>
      </button>`:''}
    </div>`;

  document.getElementById('browseView').classList.add('hidden');
  const dv=document.getElementById('detailView');
  dv.dataset.region=r.cuisine;
  dv.classList.add('active');
  window.scrollTo(0,0);
  location.hash='recipe-'+id;
}

function showBrowse(){
  document.getElementById('detailView').classList.remove('active');
  document.getElementById('browseView').classList.remove('hidden');
  history.pushState('',document.title,location.pathname);
  if(!document.getElementById('cardGrid').children.length) applyFilters();
}

function goHome(){
  showBrowse();
  delete document.getElementById('browseView').dataset.region;
  activeCat='all';
  const search=document.getElementById('searchInput'); if(search) search.value='';
  const dif=document.getElementById('difficultyFilter'); if(dif) dif.value='';
  applyFilters();
  window.scrollTo({top:0,behavior:'smooth'});
}

function browseRegion(region){
  activeCat='all';
  document.getElementById('browseView').dataset.region=region;
  applyFilters();
  document.getElementById('cardGrid').scrollIntoView({behavior:'smooth',block:'start'});
}

function browseCategory(cat){
  activeCat=cat;
  delete document.getElementById('browseView').dataset.region;
  applyFilters();
  document.getElementById('cardGrid').scrollIntoView({behavior:'smooth',block:'start'});
}

function renderExplore(){
  // Region list
  const regionCounts={northern:0,central:0,southern:0};
  allRecipes.forEach(r=>{if(regionCounts[r.cuisine]!==undefined)regionCounts[r.cuisine]++;});
  const regionList=document.getElementById('regionList');
  if(regionList){
    regionList.innerHTML=[
      {key:'northern',cls:'rn',viet:'Miền Bắc',eng:'Northern'},
      {key:'central', cls:'rc',viet:'Miền Trung',eng:'Central'},
      {key:'southern',cls:'rs',viet:'Miền Nam',eng:'Southern'},
    ].map(({key,cls,viet,eng})=>`
      <button class="region-btn ${cls}" onclick="browseRegion('${key}')">
        <span class="region-info">
          <span class="region-viet">${viet}</span>
          <span class="region-eng">${eng}</span>
        </span>
        <span class="region-count-badge">${regionCounts[key]}</span>
      </button>`).join('');
  }
  // Category tiles
  const catCounts={};
  allRecipes.forEach(r=>{catCounts[r.category]=(catCounts[r.category]||0)+1;});
  const catTiles=document.getElementById('catTiles');
  if(catTiles){
    catTiles.innerHTML=CAT_ORDER.map(cat=>`
      <button class="cat-tile" data-cat="${cat}" style="background:${catGrad(cat)}"
        onclick="browseCategory('${cat.replace(/'/g,"\\'")}')">
        <span class="cat-tile-icon">${CAT_ICON[cat]||'🍽'}</span>
        <span class="cat-tile-name">${CAT_LABEL[cat]||cat}</span>
        <span class="cat-tile-count">${catCounts[cat]||0}</span>
      </button>`).join('');
  }
}

function handleHash(){
  const h=location.hash;
  if(h.startsWith('#recipe-')){
    const id=parseInt(h.replace('#recipe-',''));
    if(!isNaN(id)&&allRecipes.length) showDetail(id);
  }
}

async function init(){
  const t=localStorage.getItem(LS_THEME)||'light';
  document.documentElement.setAttribute('data-theme',t);
  updateThemeBtn(t);
  loadSaved(); updateSavedBadge();
  const res=await fetch('data/recipes.json');
  allRecipes=await res.json();
  renderExplore();
  applyFilters();
  handleHash();
}

window.addEventListener('hashchange',handleHash);
init();
</script>
</body>
</html>
