<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Departure Lounge</title>
<meta name="description" content="A travel bucket list, boarding passes not yet stamped.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garant:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Geist Mono';
  font-style: normal; font-display: swap; font-weight: 100 900;
  src: url(https://cdn.jsdelivr.net/fontsource/fonts/geist-mono:vf@latest/latin-wght-normal.woff2) format('woff2-variations');
}

/* ══ PALETTE ══ */
:root {
  --bg:       #131a21;
  --bg-2:     #182029;
  --surface:  #202f3d;
  --surface-2:#2a4359;

  --border:   #3a5578;
  --border-2: #4d6d94;
  --text-1:   #f0e8d8;
  --text-2:   #a0a8b0;
  --text-3:   #6c7f96;
  --text-4:   #4a6076;
  --gold:     #ff6b4a;
  --gold-dim: rgba(255,107,74,0.13);
  --teal:     #00d4b4;
  --asia:     #ff5533;
  --europe:   #4da6ff;
  --americas: #00d45e;
  --africa:   #ffb020;
  --oceania:  #00d4c0;
}
:root[data-theme="light"] {
  --bg:       #fff8f0;
  --bg-2:     #ffeedd;
  --surface:  #fff5eb;
  --surface-2:#fae8d8;

  --border:   #d8b088;
  --border-2: #c89860;
  --text-1:   #1a0808;
  --text-2:   #3a2010;
  --text-3:   #6a4428;
  --text-4:   #7d5a3c;
  --gold:     #e03808;
  --gold-dim: rgba(224,56,8,0.09);
  --teal:     #007870;
  --asia:     #cc3010;
  --europe:   #1040c0;
  --americas: #007830;
  --africa:   #c07000;
  --oceania:  #007880;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: 'Geist Mono', monospace;
  background: var(--bg);
  color: var(--text-2);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  transition: background 0.3s, color 0.3s;
}

/* ══ TOPBAR ══ */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: 52px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center;
  padding: 0 24px; gap: 16px;
}
.back-link {
  font-size: 0.6rem; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--text-3); text-decoration: none; transition: color 0.2s;
  justify-self: start;
}
.back-link:hover { color: var(--gold); }
.topbar-brand {
  text-align: center; white-space: nowrap;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.8rem; letter-spacing: 8px; color: var(--text-1);
}
.topbar-right { display: flex; align-items: center; gap: 10px; justify-self: end; }
.saved-btn {
  font-size: 0.56rem; letter-spacing: 1px; text-transform: uppercase;
  color: var(--text-3); background: none;
  border: 1px solid var(--border); border-radius: 2px;
  padding: 4px 10px; cursor: pointer; transition: all 0.2s;
}
.saved-btn:hover { color: var(--gold); border-color: var(--gold); background: var(--gold-dim); }
.saved-btn.active { color: var(--teal); border-color: var(--teal); background: rgba(0,212,180,0.10); }
.theme-btn {
  font-size: 0.9rem; background: none; border: none;
  cursor: pointer; color: var(--text-3); transition: color 0.2s; padding: 4px;
}
.theme-btn:hover { color: var(--text-1); }

/* ══ CONTROLS ══ */
.controls-bar {
  position: fixed; top: 52px; left: 0; right: 0; z-index: 90;
  height: 44px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex; align-items: center; gap: 5px;
}
.filter-pill {
  font-size: 0.53rem; letter-spacing: 1.5px; text-transform: uppercase;
  border: 1px solid var(--border); border-radius: 1px;
  padding: 3px 9px; background: none; cursor: pointer;
  color: var(--text-4); transition: all 0.15s; flex-shrink: 0; height: 26px;
}
.filter-pill:hover { color: var(--text-2); border-color: var(--border-2); }
.filter-pill.active { color: var(--text-1); border-color: var(--text-3); background: var(--surface-2); }
.filter-pill[data-region="asia"].active    { color: var(--asia);     border-color: var(--asia);     background: rgba(255,85,51,0.10); }
.filter-pill[data-region="europe"].active  { color: var(--europe);   border-color: var(--europe);   background: rgba(77,166,255,0.10); }
.filter-pill[data-region="americas"].active{ color: var(--americas); border-color: var(--americas); background: rgba(0,212,94,0.10); }
.filter-pill[data-region="africa"].active  { color: var(--africa);   border-color: var(--africa);   background: rgba(255,176,32,0.10); }
.filter-pill[data-region="oceania"].active { color: var(--oceania);  border-color: var(--oceania);  background: rgba(0,212,192,0.10); }
.filter-sep { width: 1px; height: 16px; background: var(--border); flex-shrink: 0; margin: 0 2px; }
.search-wrap { flex: 1; min-width: 120px; max-width: 220px; position: relative; display: flex; align-items: center; }
.search-icon { position: absolute; left: 8px; font-size: 0.7rem; color: var(--text-4); pointer-events: none; }
.search-input {
  width: 100%; padding: 3px 8px 3px 26px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 1px;
  color: var(--text-1); font-size: 0.62rem; height: 26px;
  font-family: 'Geist Mono', monospace; letter-spacing: 0.5px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-dim); }
.search-input::placeholder { color: var(--text-4); }

/* ══ MAP CONTAINER ══ */
.map-wrap {
  position: fixed;
  top: 96px; left: 0; right: 0; bottom: 0;
  overflow: hidden;
  background: var(--bg);
}
#world-map {
  width: 100%; height: 100%; display: block;
  cursor: grab;
}
#world-map:active { cursor: grabbing; }
.map-hint {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  font-size: 0.5rem; letter-spacing: 2px; text-transform: uppercase;
  color: var(--text-4); pointer-events: none; white-space: nowrap;
  transition: opacity 0.4s;
}
.map-loading-msg {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.58rem; letter-spacing: 2px; text-transform: uppercase;
  color: var(--text-4);
}

/* Map SVG elements */
@keyframes ocean-dark {
  0%, 100% { fill: #0f1e2a; }
  33%       { fill: #132435; }
  66%       { fill: #0c1822; }
}
@keyframes ocean-light {
  0%, 100% { fill: #f0d2b0; }
  33%       { fill: #ecc8a0; }
  66%       { fill: #f4dcbc; }
}
@keyframes graticule-drift {
  0%, 100% { opacity: 0.35; }
  50%       { opacity: 0.12; }
}
:root .sphere { animation: ocean-dark 9s ease-in-out infinite; }
:root[data-theme="light"] .sphere { animation: ocean-light 9s ease-in-out infinite; }
.sphere-atmo { pointer-events: none; }
:root .sphere-atmo { fill: #ff5030; opacity: 0.07; filter: blur(22px); }
:root[data-theme="light"] .sphere-atmo { fill: #ff7040; opacity: 0.06; filter: blur(22px); }
.graticule { fill: none; stroke: var(--border); stroke-width: 0.3px; animation: graticule-drift 12s ease-in-out infinite; }
.land      { fill: var(--surface); stroke: var(--border); stroke-width: 0.4px; }
#world-map .land.destination { cursor: pointer; fill: var(--surface-2); transition: fill 0.2s; }
#world-map .land.destination:hover { fill: var(--border-2); }
.flight-path {
  fill: none; stroke-width: 1.2px;
  stroke-linecap: round;
}
.fp-asia     { stroke: var(--asia); }
.fp-europe   { stroke: var(--europe); }
.fp-americas { stroke: var(--americas); }
.fp-africa   { stroke: var(--africa); }
.fp-oceania  { stroke: var(--oceania); }

.pin-group { cursor: pointer; }
.pin-group:hover .pin-ring { filter: brightness(1.5); }
.pin-group:hover .pin-dot  { filter: brightness(1.5); }
.pin-label {
  fill: var(--text-2);
  font-size: 9px;
  font-family: 'Geist Mono', monospace;
  text-transform: uppercase;
  letter-spacing: 1px;
  opacity: 0; /* controlled by zoom handler */
  /* halo so text reads against any map colour */
  paint-order: stroke fill;
  stroke: var(--bg);
  stroke-width: 3.5px;
  stroke-linejoin: round;
  transition: fill 0.15s, opacity 0.15s;
}
.pin-group:hover .pin-label { fill: var(--text-1); opacity: 1; }
.pin-saved-dot {
  fill: var(--teal);
  opacity: 0;
  transition: opacity 0.2s;
}
.pin-saved-dot.visible { opacity: 1; }

/* Status ring: only planning/booked/visited get an extra ring — dreaming (the
   majority of pins) keeps the plain look so the map doesn't get noisy. */
.pin-status-ring { opacity: 0; }
.pin-status-ring.st-planning { stroke: var(--gold); stroke-dasharray: 2,2; opacity: 0.85; }
.pin-status-ring.st-booked   { stroke: var(--gold); opacity: 0.85; }
.pin-status-ring.st-visited  { stroke: var(--teal); opacity: 0.85; }

.world-label {
  fill: var(--text-4);
  font-size: 3px;
  font-family: 'Geist Mono', monospace;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  pointer-events: none;
}
.nyc-marker { pointer-events: none; }
.nyc-label { fill: var(--gold); font-size: 7px; font-family: 'Geist Mono', monospace; letter-spacing: 1.5px; opacity: 0.7; }

/* ══ OVERLAY ══ */
.overlay {
  position: fixed; inset: 0; z-index: 150;
  background: rgba(0,0,0,0.55);
  opacity: 0; pointer-events: none;
  transition: opacity 0.35s;
}
.overlay.visible { opacity: 1; pointer-events: all; }

/* ══ SIDE PANEL ══ */
.side-panel {
  position: fixed;
  right: -800px; top: 0; bottom: 0;
  width: 760px;
  background: var(--bg);
  border-left: 1px solid var(--border);
  z-index: 200;
  overflow-y: auto;
  transition: right 0.38s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex; flex-direction: column;
}
.side-panel.open { right: 0; }

/* Panel nav strip */
.panel-nav {
  position: sticky; top: 0; z-index: 10; flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 22px 10px 22px;
  background: var(--bg); border-bottom: 1px solid var(--border);
}
.panel-nav-arrows { display: flex; align-items: center; gap: 10px; }
.panel-nav-btn {
  background: none; border: 1px solid var(--border); border-radius: 2px;
  color: var(--text-3); font-size: 0.85rem; cursor: pointer;
  width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; font-family: 'Geist Mono', monospace;
}
.panel-nav-btn:hover { color: var(--text-1); border-color: var(--border-2); background: var(--surface); }
.panel-nav-pos { font-size: 0.52rem; letter-spacing: 1.5px; color: var(--text-4); min-width: 52px; text-align: center; }
.panel-close-btn {
  background: none; border: none; cursor: pointer;
  font-size: 1.5rem; color: var(--text-3); transition: color 0.2s; line-height: 1; padding: 4px;
}
.panel-close-btn:hover { color: var(--text-1); }

/* Panel photo hero */
.panel-photo { width: 100%; height: 240px; overflow: hidden; flex-shrink: 0; }
.panel-photo img { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(0.82); }

/* Panel boarding pass header */
.panel-accent { height: 4px; background: var(--region-color, var(--border)); flex-shrink: 0; }
.panel-pass-head {
  padding: 32px 36px 26px; border-bottom: none;
  position: relative; flex-shrink: 0;
}
/* Tear line */
.panel-tear {
  margin: 0 0; height: 0; flex-shrink: 0;
  border: none; border-top: 1px dashed var(--border-2);
  position: relative;
}
.panel-tear::before, .panel-tear::after {
  content: ''; position: absolute;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--bg-2); border: 1px dashed var(--border-2);
  top: -10px;
}
.panel-tear::before { left: -10px; }
.panel-tear::after  { right: -10px; }
.panel-meta {
  font-size: 0.6rem; letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--region-color, var(--text-4)); margin-bottom: 8px;
}
.panel-country {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(3.2rem, 9vw, 4.8rem);
  letter-spacing: 5px; color: var(--text-1); line-height: 0.93;
  margin-bottom: 16px;
}
.panel-tagline {
  font-family: 'Cormorant Garant', Georgia, serif;
  font-size: 1.15rem; font-style: italic;
  color: var(--text-2); line-height: 1.7; opacity: 0.9;
}

/* Panel meta fields */
.panel-fields {
  display: flex; flex-wrap: wrap; gap: 24px;
  padding: 22px 36px 24px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.panel-field { display: flex; flex-direction: column; gap: 5px; }
.panel-field-label { font-size: 0.55rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text-4); }
.panel-field-value { font-size: 0.82rem; color: var(--text-1); }

/* Panel tabs */
.panel-tabs {
  display: flex; flex-shrink: 0;
  padding: 0 36px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 52px; z-index: 5;
  background: var(--bg);
}
.panel-tab-btn {
  font-family: 'Geist Mono', monospace;
  font-size: 0.52rem; letter-spacing: 1.5px; text-transform: uppercase;
  background: none; border: none; border-bottom: 2px solid transparent;
  margin-bottom: -1px; padding: 12px 14px;
  color: var(--text-4); cursor: pointer; transition: all 0.15s;
}
.panel-tab-btn:hover { color: var(--text-2); }
.panel-tab-btn.active { color: var(--text-1); border-bottom-color: var(--region-color, var(--gold)); }

/* Panel body */
.panel-tab-content {
  padding: 28px 36px;
  display: flex; flex-direction: column; gap: 24px;
}
.panel-section-label {
  font-size: 0.55rem; letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--text-4); margin-bottom: 14px;
  padding-bottom: 8px; border-bottom: 1px solid var(--border);
}
.panel-section-text { font-size: 0.88rem; color: var(--text-2); line-height: 1.9; }
.place-list, .food-list { display: flex; flex-direction: column; gap: 18px; }
.place-name, .food-name {
  font-size: 0.85rem; color: var(--text-1);
  display: flex; align-items: center; gap: 9px; margin-bottom: 4px;
}
.place-name::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--region-color, var(--border)); flex-shrink: 0; }
.food-name::before  { content: ''; width: 6px; height: 2px; background: var(--region-color, var(--border)); flex-shrink: 0; }
.place-notes, .food-notes { font-size: 0.8rem; color: var(--text-3); line-height: 1.8; padding-left: 15px; }
.tips-list { display: flex; flex-direction: column; gap: 14px; }
.tip { font-size: 0.85rem; color: var(--text-2); line-height: 1.8; display: flex; gap: 12px; }
.tip::before { content: '—'; color: var(--text-4); flex-shrink: 0; }

/* Wishlist button — sticky bottom of panel */
.panel-footer {
  position: sticky; bottom: 0;
  padding: 16px 36px 22px;
  background: var(--bg);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.wishlist-btn {
  width: 100%; padding: 13px;
  background: none; border: 1px solid var(--border); border-radius: 2px;
  font-size: 0.65rem; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--text-2); cursor: pointer; transition: all 0.2s;
  font-family: 'Geist Mono', monospace;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.wishlist-btn:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
.wishlist-btn.saved { border-color: var(--teal); color: var(--teal); background: rgba(0,212,180,0.08); }

/* Vibe tags */
.vibe-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 3px; }
.vibe-chip {
  font-size: 0.58rem; letter-spacing: 0.5px; padding: 2px 9px;
  border: 1px solid var(--border-2); color: var(--text-2);
}

/* Trip status pills */
.status-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.status-pill {
  font-family: 'Geist Mono', monospace;
  font-size: 0.6rem; letter-spacing: 1px; text-transform: uppercase;
  padding: 5px 12px; border: 1px solid var(--border); border-radius: 2px;
  background: none; color: var(--text-3); cursor: pointer; transition: all 0.15s;
}
.status-pill:hover { border-color: var(--border-2); color: var(--text-1); }
.status-pill.active {
  color: var(--bg); background: var(--region-color, var(--gold));
  border-color: var(--region-color, var(--gold)); font-weight: 600;
}

/* Passport-style "visited" stamp, fired over the boarding-pass header */
.visited-stamp {
  position: absolute; top: 22px; right: 30px;
  transform: rotate(-13deg);
  width: 78px; height: 78px;
  border: 3px solid var(--teal); border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  pointer-events: none; opacity: 0; z-index: 5;
}
.visited-stamp .stamp-check { font-size: 1.5rem; color: var(--teal); line-height: 1; }
.visited-stamp .stamp-text {
  font-size: 0.4rem; letter-spacing: 2px; text-transform: uppercase;
  color: var(--teal); margin-top: 3px; font-family: 'Geist Mono', monospace;
}
.visited-stamp.stamping { animation: stampIn 0.5s cubic-bezier(0.2,0,0.4,1) forwards; }
.visited-stamp.unstamping { animation: stampOut 0.3s ease-in forwards; }

/* Filter selects */
.filter-select {
  font-family: 'Geist Mono', monospace;
  font-size: 0.53rem; letter-spacing: 1px; text-transform: uppercase;
  border: 1px solid var(--border); border-radius: 1px;
  padding: 0 8px; height: 26px; background: var(--bg);
  color: var(--text-4); cursor: pointer; flex-shrink: 0;
  transition: all 0.15s; appearance: none; -webkit-appearance: none;
  min-width: 80px;
}
.filter-select:focus { outline: none; border-color: var(--gold); color: var(--text-1); }
.filter-select.active { color: var(--text-1); border-color: var(--text-3); background: var(--surface-2); }

/* Stats in controls bar */
.stats-info {
  margin-left: auto; font-size: 0.52rem; letter-spacing: 1px;
  color: var(--text-4); white-space: nowrap; flex-shrink: 0;
}

/* Random picker button */
@keyframes randomPop {
  0%   { transform: scale(1); }
  30%  { transform: scale(1.12); box-shadow: 0 0 12px var(--gold); }
  70%  { transform: scale(0.96); }
  100% { transform: scale(1); }
}
.random-btn {
  font-size: 0.56rem; letter-spacing: 1px; text-transform: uppercase;
  color: var(--text-3); background: none;
  border: 1px solid var(--border); border-radius: 2px;
  padding: 4px 10px; cursor: pointer; transition: all 0.2s;
  white-space: nowrap;
}
.random-btn:hover { color: var(--gold); border-color: var(--gold); background: var(--gold-dim); }
.random-btn.popping { animation: randomPop 0.45s ease-out; }

/* Active pin + path highlight */
.pin-group.active { filter: brightness(1.8) drop-shadow(0 0 4px var(--region-color, white)); }
.flight-path.active { opacity: 0.85 !important; stroke-width: 2.2px; }

/* Planning + visited hover */

/* Region cascade */
.rc-asia     { --region-color: var(--asia); }
.rc-europe   { --region-color: var(--europe); }
.rc-americas { --region-color: var(--americas); }
.rc-africa   { --region-color: var(--africa); }
.rc-oceania  { --region-color: var(--oceania); }

/* ══ PIN HOVER TOOLTIP ══ */
#mapTooltip {
  position: fixed;
  z-index: 80;
  pointer-events: none;
  padding: 8px 12px;
  background: var(--surface);
  border: 1px solid var(--border-2);
  border-left: 3px solid var(--region-color, var(--gold));
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 0.15s, transform 0.15s;
  max-width: 220px;
  pointer-events: none;
}
#mapTooltip.visible {
  opacity: 1;
  transform: translateY(0);
}
.tooltip-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.05rem;
  letter-spacing: 3px;
  color: var(--text-1);
  line-height: 1;
  margin-bottom: 5px;
}
.tooltip-tagline {
  font-family: 'Cormorant Garant', serif;
  font-size: 0.75rem;
  font-style: italic;
  color: var(--text-3);
  line-height: 1.4;
}
.tooltip-region {
  font-size: 0.48rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--region-color, var(--text-4));
  margin-bottom: 4px;
}

/* ══ STAMP ANIMATION ══ */
@keyframes stampIn {
  0%   { transform: scale(3.5) rotate(-18deg); opacity: 0; }
  55%  { transform: scale(0.88) rotate(3deg);  opacity: 1; }
  75%  { transform: scale(1.04) rotate(-1deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg);     opacity: 1; }
}
@keyframes stampOut {
  0%   { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(0.7); }
}
#wishlistStamp {
  position: absolute;
  top: 50%; left: 50%;
  width: 90px; height: 90px;
  margin: -45px 0 0 -45px;
  border: 3px solid var(--teal);
  border-radius: 50%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  pointer-events: none;
  opacity: 0;
  z-index: 20;
}
#wishlistStamp .stamp-heart { font-size: 1.8rem; color: var(--teal); }
#wishlistStamp .stamp-text  {
  font-size: 0.42rem; letter-spacing: 3px; text-transform: uppercase;
  color: var(--teal); margin-top: 3px;
  font-family: 'Geist Mono', monospace;
}
#wishlistStamp.stamping { animation: stampIn 0.5s cubic-bezier(0.2,0,0.4,1) forwards; }
#wishlistStamp.unstamping { animation: stampOut 0.3s ease-in forwards; }

/* ══ ZOOM CONTROLS ══ */
.zoom-btns {
  position: absolute; bottom: 20px; right: 20px;
  display: flex; flex-direction: column; gap: 4px; z-index: 50;
}
.zoom-btn {
  width: 44px; height: 44px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text-3); font-size: 1rem; line-height: 1;
  cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
  font-family: monospace;
}
.zoom-btn:hover { color: var(--text-1); border-color: var(--border-2); background: var(--surface-2); }

/* ══ VIEW TOGGLE ══ */
.view-toggle { display: flex; border: 1px solid var(--border); border-radius: 2px; overflow: hidden; flex-shrink: 0; }
.view-toggle-btn {
  font-family: 'Geist Mono', monospace;
  font-size: 0.56rem; letter-spacing: 1px; text-transform: uppercase;
  color: var(--text-3); background: none; border: none;
  padding: 4px 10px; cursor: pointer; transition: all 0.2s;
}
.view-toggle-btn + .view-toggle-btn { border-left: 1px solid var(--border); }
.view-toggle-btn:hover { color: var(--text-1); background: var(--surface); }
.view-toggle-btn.active { color: var(--gold); background: var(--gold-dim); }

/* ══ CALENDAR VIEW ══ */
.calendar-view {
  position: fixed; top: 52px; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column;
  background: var(--bg);
}
.cal-toolbar {
  height: 44px; flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px;
  padding: 0 24px;
}
.cal-year-nav { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.cal-year-btn {
  background: none; border: 1px solid var(--border); border-radius: 2px;
  color: var(--text-3); font-size: 0.75rem; cursor: pointer;
  width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; font-family: 'Geist Mono', monospace;
}
.cal-year-btn:hover { color: var(--text-1); border-color: var(--border-2); }
.cal-year-label {
  font-family: 'Bebas Neue', sans-serif; letter-spacing: 3px;
  font-size: 1.1rem; color: var(--text-1); min-width: 56px; text-align: center;
}
.cal-search-wrap { flex: 1; max-width: 220px; position: relative; display: flex; align-items: center; }
.cal-search-wrap .search-icon { position: absolute; left: 8px; font-size: 0.7rem; color: var(--text-4); pointer-events: none; }
.cal-search-input {
  width: 100%; padding: 5px 10px 5px 28px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 1px;
  color: var(--text-1); font-size: 0.72rem; height: 30px;
  font-family: 'Geist Mono', monospace; letter-spacing: 0.5px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.cal-search-input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-dim); }
.cal-search-input::placeholder { color: var(--text-4); }
.cal-stats { margin-left: auto; font-size: 0.6rem; letter-spacing: 1px; color: var(--text-4); white-space: nowrap; flex-shrink: 0; }
.cal-hint { font-size: 0.58rem; letter-spacing: 1px; color: var(--text-4); white-space: nowrap; flex-shrink: 0; }

.cal-body { flex: 1; display: flex; overflow: hidden; }

.cal-deck {
  width: 260px; flex-shrink: 0;
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.cal-deck-label {
  font-size: 0.6rem; letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--text-4); padding: 14px 20px 10px;
  flex-shrink: 0;
}
.cal-deck-list { flex: 1; overflow-y: auto; padding: 0 12px 16px; display: flex; flex-direction: column; gap: 5px; }
.cal-deck-item {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 12px; border: 1px solid var(--border);
  border-radius: 2px; cursor: grab; background: var(--bg-2);
  transition: all 0.15s; user-select: none;
}
.cal-deck-item:hover { border-color: var(--border-2); background: var(--surface); }
.cal-deck-item.selected { border-color: var(--gold); background: var(--gold-dim); }
.cal-deck-item.dragging { opacity: 0.4; }
.cal-deck-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--dot-color, var(--text-4)); }
.cal-deck-name { font-size: 0.86rem; color: var(--text-1); flex: 1; }
.cal-deck-badge {
  font-size: 0.58rem; letter-spacing: 1px; color: var(--teal);
  border: 1px solid var(--teal); border-radius: 1px; padding: 2px 5px;
  flex-shrink: 0;
}
.cal-deck-toggle {
  background: none; border: none; color: var(--text-4); cursor: pointer;
  font-size: 0.6rem; width: 14px; flex-shrink: 0; padding: 0;
  display: flex; align-items: center; justify-content: center;
}
.cal-deck-toggle:hover { color: var(--text-1); }
.cal-deck-toggle-spacer { width: 14px; flex-shrink: 0; }
.cal-deck-item.cal-deck-city {
  margin-left: 22px; padding: 6px 12px; background: transparent; border-style: dashed;
}
.cal-deck-item.cal-deck-city .cal-deck-dot { width: 5px; height: 5px; opacity: 0.75; }
.cal-deck-item.cal-deck-city .cal-deck-name { font-size: 0.78rem; color: var(--text-2); }

.cal-grid {
  flex: 1; overflow: auto; padding: 14px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(4, minmax(150px, 1fr));
  gap: 12px;
}
.cal-month {
  border: 1px dashed var(--border); border-radius: 3px;
  display: flex; flex-direction: column; overflow: hidden;
  transition: border-color 0.15s, background 0.15s;
}
.cal-month.drag-over { border-color: var(--gold); background: var(--gold-dim); border-style: solid; }
.cal-month.drag-over.ideal { border-color: var(--teal); background: rgba(0,212,180,0.08); }
.cal-month-head {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 9px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.cal-month-name {
  font-family: 'Bebas Neue', sans-serif; letter-spacing: 2.5px;
  font-size: 1.2rem; color: var(--text-1);
}
.cal-month-count { font-size: 0.6rem; letter-spacing: 1px; color: var(--text-4); }
.cal-month-body { flex: 1; overflow-y: auto; padding: 9px 11px; display: flex; flex-direction: column; gap: 6px; }
.cal-month-empty { font-size: 0.64rem; letter-spacing: 0.5px; color: var(--text-4); padding: 8px 2px; }
.cal-chip {
  display: flex; align-items: center; gap: 7px;
  font-size: 0.8rem; color: var(--text-1);
  padding: 5px 8px; border-radius: 2px;
  background: var(--surface); border-left: 2px solid var(--dot-color, var(--border-2));
  cursor: pointer;
}
.cal-chip-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-chip-sub { font-size: 0.6rem; color: var(--text-4); margin-left: 5px; }
.cal-chip-remove {
  background: none; border: none; color: var(--text-4); cursor: pointer;
  font-size: 0.85rem; line-height: 1; padding: 0 2px; flex-shrink: 0;
}
.cal-chip-remove:hover { color: var(--gold); }

/* ══ BUDGET VIEW ══ */
.budget-view {
  position: fixed; top: 52px; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column;
  background: var(--bg);
}
.budget-empty {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; color: var(--text-4); text-align: center; padding: 20px;
}
.budget-empty-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 2px; color: var(--text-2); }
.budget-empty-sub { font-size: 0.72rem; letter-spacing: 0.5px; max-width: 360px; line-height: 1.6; }

.budget-table-wrap { flex: 1; overflow: auto; }
.budget-head-row, .budget-line-row {
  display: grid;
  grid-template-columns: 20px 1.3fr 80px 96px 96px 96px 96px 100px 26px;
  gap: 12px; align-items: center;
  padding: 10px 24px;
  min-width: 870px;
}
.budget-head-row {
  font-size: 0.54rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-4);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--bg); z-index: 2;
}
.budget-head-row span:not(:first-child) { text-align: right; }
.budget-line-row { border-bottom: 1px solid var(--border); font-size: 0.78rem; color: var(--text-1); transition: background 0.15s; }
.budget-line-row:hover { background: var(--bg-2); }
.budget-line-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dot-color, var(--text-4)); }
.budget-line-name { display: flex; align-items: baseline; gap: 8px; overflow: hidden; }
.budget-line-name b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.budget-line-sub { font-size: 0.62rem; color: var(--text-4); flex-shrink: 0; }
.budget-line-month { font-size: 0.56rem; letter-spacing: 1px; color: var(--text-4); flex-shrink: 0; }
.budget-line-days { display: flex; align-items: center; gap: 5px; justify-content: flex-end; }
.budget-days-input {
  width: 42px; padding: 3px 4px; text-align: right;
  background: var(--surface); border: 1px solid var(--border); border-radius: 1px;
  color: var(--text-1); font-size: 0.78rem; font-family: 'Geist Mono', monospace;
}
.budget-days-input:focus { outline: none; border-color: var(--gold); }
.budget-line-days span { font-size: 0.6rem; color: var(--text-4); }
.budget-line-cat { display: flex; align-items: center; justify-content: flex-end; gap: 2px; }
.budget-cat-prefix { font-size: 0.7rem; color: var(--text-4); }
.budget-cat-input {
  width: 64px; padding: 3px 5px; text-align: right;
  background: var(--surface); border: 1px solid var(--border); border-radius: 1px;
  color: var(--text-2); font-size: 0.76rem; font-family: 'Geist Mono', monospace;
}
.budget-cat-input:focus { outline: none; border-color: var(--gold); color: var(--text-1); }
.budget-cat-input:hover { border-color: var(--border-2); }
.budget-line-total { text-align: right; font-weight: 600; color: var(--text-1); }
.budget-line-remove {
  background: none; border: none; color: var(--text-4); cursor: pointer;
  font-size: 0.85rem; line-height: 1; text-align: right; justify-self: end;
}
.budget-line-remove:hover { color: var(--gold); }

.budget-footer {
  flex-shrink: 0; border-top: 1px solid var(--border);
  padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px;
  flex-wrap: wrap;
}
.budget-footer-note { font-size: 0.66rem; color: var(--text-3); letter-spacing: 0.5px; }
.budget-footer-note b { color: var(--text-1); }
.budget-footer-total { text-align: right; }
.budget-footer-total-label { font-size: 0.55rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text-4); }
.budget-footer-total-value { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 1px; color: var(--text-1); }

/* ══ PANEL BUDGET/TIMING SIDEBAR ══ */
.panel-month-strip { display: flex; gap: 3px; }
.panel-month-cell {
  flex: 1; height: 22px; display: flex; align-items: center; justify-content: center;
  font-size: 0.48rem; letter-spacing: 0.5px; color: var(--text-4);
  background: var(--surface); border-radius: 1px;
}
.panel-month-cell.ideal { background: var(--region-color, var(--teal)); color: var(--bg); font-weight: 600; }
.budget-bars { display: flex; flex-direction: column; gap: 12px; }
.budget-row { display: flex; align-items: center; gap: 12px; }
.budget-label { font-size: 0.62rem; letter-spacing: 1px; color: var(--text-2); width: 96px; flex-shrink: 0; text-transform: uppercase; }
.budget-track { flex: 1; height: 6px; background: var(--surface); border-radius: 3px; overflow: hidden; }
.budget-fill { height: 100%; background: var(--region-color, var(--gold)); border-radius: 3px; }
.budget-value { font-size: 0.68rem; color: var(--text-1); width: 88px; flex-shrink: 0; text-align: right; }
.budget-total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 10px; border-top: 1px solid var(--border); margin-top: 2px; }
.budget-total-label { font-size: 0.58rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-4); }
.budget-total-value { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 1px; color: var(--text-1); }

/* ══ PANEL U.S. STATES MAP ══ */
.us-states-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.us-states-clear-btn {
  font-size: 0.56rem; letter-spacing: 1px; text-transform: uppercase;
  color: var(--text-3); cursor: pointer; transition: color 0.15s; flex-shrink: 0;
}
.us-states-clear-btn:hover { color: var(--gold); }
.us-map-wrap { position: relative; width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 10px; }
#usMapSvg { width: 100%; height: auto; display: block; }
.us-map-loading {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 0.6rem; letter-spacing: 1px; text-transform: uppercase; color: var(--text-4);
}
.us-state { fill: var(--surface-2); stroke: var(--border); stroke-width: 0.75px; cursor: pointer; transition: fill 0.15s; }
.us-state:hover { fill: var(--border-2); }
.us-state.visited { fill: var(--region-color, var(--americas)); stroke: var(--region-color, var(--americas)); }
.us-state-abbr {
  font-family: 'Geist Mono', monospace;
  font-size: 7.5px;
  fill: var(--text-2);
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
  paint-order: stroke fill;
  stroke: var(--bg);
  stroke-width: 2.5px;
  stroke-linejoin: round;
}
.us-states-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
.us-state-chip { cursor: pointer; transition: all 0.15s; color: var(--text-1); border-color: var(--border-2); }
.us-state-chip:hover { border-color: var(--gold); color: var(--gold); }
.us-states-empty { font-size: 0.72rem; color: var(--text-4); margin-top: 12px; }

/* ══ RESPONSIVE ══ */
@media (max-width: 640px) {
  body { overflow: auto; }
  .map-wrap { position: relative; top: 0; height: 55vh; margin-top: 96px; }
  .side-panel { width: 100%; right: -100%; }
  .panel-pass-head { padding: 24px 24px 20px; }
  .panel-fields, .panel-tab-content, .panel-footer { padding-left: 24px; padding-right: 24px; }
  .panel-tabs { padding: 0 24px; }
  .side-panel.open { right: 0; }
  .topbar-brand { font-size: 1.4rem; letter-spacing: 5px; }
  .filter-select { display: none; }
  .cal-body { flex-direction: column; }
  .cal-deck { width: 100%; max-height: 180px; border-right: none; border-bottom: 1px solid var(--border); }
  .cal-grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(6, minmax(120px, 1fr)); }
  .cal-toolbar { flex-wrap: wrap; height: auto; padding: 8px 16px; gap: 8px; }
  .cal-hint { display: none; }
  .budget-label { width: 76px; }
  .budget-value { width: 70px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <a href="../../index.html" class="back-link">← Portfolio</a>
  <div class="topbar-brand">Departure Lounge</div>
  <div class="topbar-right">
    <div class="view-toggle">
      <button class="view-toggle-btn active" id="viewMapBtn" onclick="switchView('map')">✈ Map</button>
      <button class="view-toggle-btn" id="viewCalBtn" onclick="switchView('calendar')">▦ Calendar</button>
      <button class="view-toggle-btn" id="viewBudgetBtn" onclick="switchView('budget')">$ Budget</button>
    </div>
    <button class="random-btn" id="randomBtn" onclick="pickRandom()">✦ surprise me</button>
    <button class="saved-btn" id="savedBtn" onclick="toggleSavedFilter()">♥ <span id="savedCount">0</span></button>
    <button class="theme-btn" onclick="toggleTheme()">◐</button>
  </div>
</div>

<!-- CONTROLS -->
<div class="controls-bar" id="controlsBar">
  <button class="filter-pill active" data-region="all">All</button>
  <button class="filter-pill" data-region="asia">Asia</button>
  <button class="filter-pill" data-region="europe">Europe</button>
  <button class="filter-pill" data-region="americas">Americas</button>
  <button class="filter-pill" data-region="africa">Africa</button>
  <button class="filter-pill" data-region="oceania">Oceania</button>
  <div class="filter-sep"></div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="search" class="search-input" id="searchInput" placeholder="Search…">
  </div>
  <div class="filter-sep"></div>
  <select class="filter-select" id="monthFilter" onchange="onMonthChange()">
    <option value="">Month</option>
    <option value="1">January</option><option value="2">February</option>
    <option value="3">March</option><option value="4">April</option>
    <option value="5">May</option><option value="6">June</option>
    <option value="7">July</option><option value="8">August</option>
    <option value="9">September</option><option value="10">October</option>
    <option value="11">November</option><option value="12">December</option>
  </select>
  <select class="filter-select" id="statusFilter" onchange="onStatusChange()">
    <option value="">Status</option>
    <option value="dreaming">Dreaming</option>
    <option value="planning">Planning</option>
    <option value="booked">Booked</option>
    <option value="visited">Visited</option>
  </select>
  <select class="filter-select" id="vibeFilter" onchange="onVibeChange()">
    <option value="">Vibe</option>
  </select>
  <span class="stats-info" id="statsInfo"></span>
</div>

<!-- PIN HOVER TOOLTIP -->
<div id="mapTooltip">
  <div class="tooltip-region" id="ttRegion"></div>
  <div class="tooltip-name"   id="ttName"></div>
  <div class="tooltip-tagline" id="ttTagline"></div>
</div>

<!-- MAP -->
<div class="map-wrap" id="mapWrap">
  <div class="map-loading-msg" id="mapLoading">Charting routes…</div>
  <svg id="world-map"></svg>
  <div class="map-hint" id="mapHint">Click a destination to board · Scroll to zoom · Drag to pan</div>
  <div class="zoom-btns">
    <button class="zoom-btn" onclick="mapZoomIn()" title="Zoom in">+</button>
    <button class="zoom-btn" onclick="mapZoomReset()" title="Reset" style="font-size:0.65rem;letter-spacing:0">⊙</button>
    <button class="zoom-btn" onclick="mapZoomOut()" title="Zoom out">−</button>
  </div>
</div>

<!-- CALENDAR VIEW -->
<div class="calendar-view" id="calendarView" style="display:none">
  <div class="cal-toolbar">
    <div class="cal-year-nav">
      <button class="cal-year-btn" onclick="calYearShift(-1)" title="Previous year">←</button>
      <span class="cal-year-label" id="calYearLabel"></span>
      <button class="cal-year-btn" onclick="calYearShift(1)" title="Next year">→</button>
    </div>
    <div class="cal-search-wrap">
      <span class="search-icon">⌕</span>
      <input type="search" class="cal-search-input" id="calSearchInput" placeholder="Search…">
    </div>
    <span class="cal-hint" id="calHint">Drag a destination onto a month</span>
    <span class="cal-stats" id="calStats"></span>
  </div>
  <div class="cal-body">
    <div class="cal-deck">
      <div class="cal-deck-label">Destinations</div>
      <div class="cal-deck-list" id="calDeckList"></div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>
</div>

<!-- BUDGET VIEW -->
<div class="budget-view" id="budgetView" style="display:none">
  <div class="cal-toolbar">
    <div class="cal-year-nav">
      <button class="cal-year-btn" onclick="calYearShift(-1)" title="Previous year">←</button>
      <span class="cal-year-label" id="budgetYearLabel"></span>
      <button class="cal-year-btn" onclick="calYearShift(1)" title="Next year">→</button>
    </div>
    <span class="cal-hint">Conservative estimate (high end of each range) · edit days per trip</span>
    <span class="cal-stats" id="budgetStats"></span>
  </div>
  <div id="budgetContent" style="flex:1; display:flex; flex-direction:column; overflow:hidden;"></div>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="closePanel()"></div>

function getStatus(c) { return statusOverrides[c.id] || c.status; }

function setStatus(id, status) {
  const c = allCountries.find(x => x.id === id);
  if (!c) return;
  const prev = getStatus(c);
  if (prev === status) return;
  statusOverrides[id] = status;
  saveStatusOverrides();
  document.querySelectorAll('#statusPills .status-pill').forEach(p => {
    p.classList.toggle('active', p.dataset.status === status);
  });
  updatePinStatus(id, status);
  applyFilters();
  if (status === 'visited' && prev !== 'visited') fireStatusStamp();
}

function updatePinStatus(id, status) {
  if (!mapSvg) return;
  mapSvg.selectAll('.pin-group').each(function() {
    if (+this.getAttribute('data-id') !== id) return;
    this.setAttribute('data-status', status);
    d3.select(this).select('.pin-status-ring').attr('class', `pin-status-ring st-${status}`);
  });
}

function fireStatusStamp() {
  const s = document.getElementById('statusStamp');
  if (!s) return;
  s.classList.remove('stamping', 'unstamping');
  void s.offsetWidth;
  s.classList.add('stamping');
  s.addEventListener('animationend', () => {
    setTimeout(() => {
      s.classList.remove('stamping');
      s.classList.add('unstamping');
      s.addEventListener('animationend', () => s.classList.remove('unstamping'), { once: true });
    }, 900);
  }, { once: true });
}

// ── MAP ───────────────────────────────────────────
async function initMap() {
  if (typeof d3 === 'undefined') {
    document.getElementById('mapLoading').textContent = 'Map unavailable — check connection.';
    return;
  }

  const wrap = document.getElementById('mapWrap');
  const W = wrap.clientWidth  || 960;
  const H = wrap.clientHeight || 540;

  const svg = d3.select('#world-map')
    .attr('viewBox', `0 0 ${W} ${H}`)
    .attr('preserveAspectRatio', 'xMidYMid meet');

  mapSvg = svg;

  // mapG: zoom-transformed (land, routes scale with map)
  mapG = svg.append('g').attr('class', 'map-g');

  mapProjection = d3.geoNaturalEarth1()
    .scale(W / 6.28)
    .translate([W / 2, H / 2 + H * 0.04]);

  const path = d3.geoPath().projection(mapProjection);

  // pinLayer: NOT zoom-transformed — pins stay the same screen size (Leaflet feel)
  pinLayer = svg.append('g').attr('class', 'pin-layer');

  // Zoom — halved wheel sensitivity, drag to pan when zoomed in
  zoomBehavior = d3.zoom()
    .scaleExtent([1, 10])
    .translateExtent([[-W * 0.4, -H * 0.4], [W * 1.4, H * 1.4]])
    .wheelDelta(e => -e.deltaY * (e.deltaMode === 1 ? 0.05 : e.deltaMode ? 1 : 0.001))
    .filter(event => {
      // Allow wheel zoom, double-click zoom, and drag-to-pan (mouse + touch)
      // Block right-click and ctrl+drag (native browser zoom gesture)
      if (event.type === 'wheel') return true;
      if (event.type === 'dblclick') return true;
      if (event.button === 2) return false; // right-click
      if (event.ctrlKey && event.type === 'mousedown') return false;
      return event.type === 'mousedown' || event.type === 'mousemove' ||
             event.type === 'touchstart' || event.type === 'touchmove';
    })
    .on('zoom', ({ transform }) => {
      const { k, x, y } = transform;
      mapG.attr('transform', transform);
      // Reposition each pin in screen space so it stays fixed size
      pinLayer.selectAll('[data-px]').each(function() {
        const px = +this.getAttribute('data-px');
        const py = +this.getAttribute('data-py');
        d3.select(this).attr('transform', `translate(${px * k + x},${py * k + y})`);
      });
      // Gate destination label visibility
      pinLayer.selectAll('.pin-label').each(function() {
        const minZ = +this.getAttribute('data-min-zoom') || 1;
        d3.select(this).style('opacity', k >= minZ ? 0.85 : 0);
      });
      // Gate world label visibility (inside mapG, so font scales with zoom)
      mapG.selectAll('.world-label').each(function() {
        const minZ = +this.getAttribute('data-min-zoom') || 2;
        d3.select(this).style('opacity', k >= minZ ? 0.22 : 0);
      });
    });
  svg.call(zoomBehavior);

  // Atmosphere glow behind sphere
  mapG.append('path')
    .datum({ type: 'Sphere' })
    .attr('class', 'sphere-atmo')
    .attr('d', path);

  // Sphere background
  mapG.append('path')
    .datum({ type: 'Sphere' })
    .attr('class', 'sphere')
    .attr('d', path);

  // Graticule
  mapG.append('path')
    .datum(d3.geoGraticule().step([30, 30])())
    .attr('class', 'graticule')
    .attr('d', path);

  // Load world topology
  let world;
  try {
    world = await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json');
  } catch(e) {
    document.getElementById('mapLoading').textContent = 'Could not load map data.';
    return;
  }

  document.getElementById('mapLoading').style.display = 'none';
  // (initMap is async so it already returns a Promise)

  const features = topojson.feature(world, world.objects.countries).features;

  // Countries
  mapG.append('g').selectAll('path')
    .data(features)
    .join('path')
    .attr('class', d => ISO_MAP[d.id] ? 'land destination' : 'land')
    .attr('d', path)
    .on('click', (event, d) => {
      const name = ISO_MAP[d.id];
      if (!name) return;
      const c = allCountries.find(x => x.name === name);
      if (c) openPanel(c.id);
    });

  // World country labels — inside mapG so they scale with zoom
  const destNames = new Set(Object.values(ISO_MAP));
  const worldLabelG = mapG.append('g');
  features.forEach(feat => {
    const name = ALL_ISO_NAMES[+feat.id];
    if (!name || destNames.has(name)) return;
    const c = path.centroid(feat);
    if (!c || isNaN(c[0]) || isNaN(c[1])) return;
    const area = d3.geoArea(feat);
    const minZ = area > 0.1 ? 2.0 : area > 0.03 ? 2.8 : area > 0.008 ? 3.8 : area > 0.002 ? 5.0 : 7.0;
    worldLabelG.append('text')
      .attr('class', 'world-label')
      .attr('x', c[0]).attr('y', c[1])
      .attr('text-anchor', 'middle').attr('dominant-baseline', 'middle')
      .attr('data-min-zoom', minZ)
      .style('opacity', 0)
      .text(name.toUpperCase());
  });

  // NYC origin marker — in pinLayer so it stays fixed size
  const [nx, ny] = mapProjection(NYC);
  const nycG = pinLayer.append('g')
    .attr('class', 'nyc-marker')
    .attr('transform', `translate(${nx},${ny})`)
    .attr('data-px', nx).attr('data-py', ny);
  nycG.append('polygon')
    .attr('points', '0,-6 5,0 0,6 -5,0')
    .attr('fill', 'none').attr('stroke', 'var(--gold)').attr('stroke-width', 1.5);
  nycG.append('polygon')
    .attr('points', '0,-3 2.5,0 0,3 -2.5,0')
    .attr('fill', 'var(--gold)');
  nycG.append('text').attr('class', 'nyc-label').attr('dx', 9).attr('dy', 3).text('JFK');

  // Routes in mapG (scale with map), pins in pinLayer (fixed screen size)
  drawAll(mapG, pinLayer, nx, ny);
}

function drawAll(routeLayer, pins, nx, ny) {
  const routeG = routeLayer.append('g');
  const pinG   = pins;

  allCountries.forEach((c, i) => {
    const lnglat = COORDS[c.name];
    if (!lnglat) return;

    const [px, py] = mapProjection(lnglat);
    const delay    = 300 + i * 160;   // ms before path starts
    const pathDur  = 900;             // ms path takes to draw

    // ── Arc control point ──────────────────────────
    const dist = Math.hypot(px - nx, py - ny);
    const cpx  = (nx + px) / 2;
    const cpy  = (ny + py) / 2 - Math.min(dist * 0.38, 140);
    const d    = `M ${nx} ${ny} Q ${cpx} ${cpy} ${px} ${py}`;

    // ── Flight path ────────────────────────────────
    const line = routeG.append('path')
      .attr('class', `flight-path fp-${c.region}`)
      .attr('id', `fp-${c.id}`)
      .attr('d', d)
      .attr('data-id', c.id)
      .attr('data-region', c.region)
      .style('opacity', 0)
      .style('stroke-dasharray', 2000)
      .style('stroke-dashoffset', 2000);

    // Correct dasharray after element exists in DOM
    requestAnimationFrame(() => {
      const len = line.node().getTotalLength();
      line.style('stroke-dasharray', len).style('stroke-dashoffset', len);
    });

    setTimeout(() => {
      line.style('transition', `opacity 0.4s, stroke-dashoffset ${pathDur}ms cubic-bezier(0.4,0,0.55,1)`)
          .style('opacity', 0.38)
          .style('stroke-dashoffset', 0);
    }, delay);

    // ── Pin ───────────────────────────────────────
    setTimeout(() => {
      const pg = pinG.append('g')
        .attr('class', `pin-group rc-${c.region}`)
        .attr('transform', `translate(${px},${py})`)
        .attr('data-id', c.id)
        .attr('data-region', c.region)
        .attr('data-status', getStatus(c))
        .attr('data-px', px)
        .attr('data-py', py)
        .style('opacity', 0)
        .on('click', () => openPanel(c.id));

      pg.append('circle').attr('r', 10)
        .attr('fill', 'none')
        .attr('stroke', `var(--${c.region})`)
        .attr('stroke-width', 1)
        .attr('opacity', 0.2)
        .style('animation', `pinPulse 2.8s ${Math.random()*2}s ease-in-out infinite`);
      pg.append('circle').attr('class', `pin-status-ring st-${getStatus(c)}`).attr('r', 8)
        .attr('fill', 'none').attr('stroke-width', 1.4);
      pg.append('circle').attr('class', 'pin-ring').attr('r', 5.5)
        .attr('fill', 'none').attr('stroke', `var(--${c.region})`).attr('stroke-width', 1.5);
      pg.append('circle').attr('class', 'pin-dot').attr('r', 2.8)
        .attr('fill', `var(--${c.region})`);

      // Saved dot (gold, top-right of pin)
      pg.append('circle').attr('class', `pin-saved-dot ${savedIds.has(c.id) ? 'visible' : ''}`)
        .attr('cx', 5).attr('cy', -5).attr('r', 2.5);

      // Label — positioned per LABEL_OPTS, hidden until minZoom reached
      const isEast = lnglat[0] > -30;
      const lo = LABEL_OPTS[c.name];
      const ldx    = lo ? lo[0] : (isEast ? 9 : -9);
      const ldy    = lo ? lo[1] : 3.5;
      const anchor = lo ? lo[2] : (isEast ? 'start' : 'end');
      const minZ   = lo ? lo[3] : 1.6;
      pg.append('text').attr('class', 'pin-label')
        .attr('dx', ldx).attr('dy', ldy)
        .attr('text-anchor', anchor)
        .attr('data-min-zoom', minZ)
        .style('opacity', minZ <= 1 ? 0.85 : 0)
        .text(c.name.toUpperCase());

      // Hover tooltip
      pg.on('mouseenter', function(event) { showTooltip(c, event); })
        .on('mousemove',  function(event) { moveTooltip(event); })
        .on('mouseleave', hideTooltip);

      // Fade in
      pg.transition().duration(350).style('opacity', 1);


    }, delay + pathDur + 80);
  });
}

    const dailyTotal = BUDGET_CATS.filter(([key]) => key !== 'lodging')
      .reduce((sum, [key]) => sum + (((bb[key]||{}).low||0) + ((bb[key]||{}).high||0)) / 2, 0)

    const rows = BUDGET_CATS.map(([key, label, unit]) => {

        <div class="budget-label">${label}</div>

  hideTooltip();

  document.getElementById('sidePanel').classList.add('open');
  document.getElementById('overlay').classList.add('visible');

  // URL hash
  history.replaceState(null, '', '#' + c.name.toLowerCase().replace(/\s+/g, '-'));

  // Highlight active pin + path
  setActivePin(id);

  // Zoom map to destination
  zoomToCountry(c.name);
}

function closePanel() {
  document.getElementById('sidePanel').classList.remove('open');
  document.getElementById('overlay').classList.remove('visible');
  if (mapSvg) {
    mapSvg.selectAll('.pin-group').classed('active', false);
    mapSvg.selectAll('.flight-path').classed('active', false);
    mapSvg.transition().duration(600).call(zoomBehavior.transform, d3.zoomIdentity);
  }
  history.replaceState(null, '', location.pathname);
  currentId = null;
}

function navigatePanel(dir) {
  if (currentId === null) return;
  const idx  = allCountries.findIndex(x => x.id === currentId);
  const next = allCountries[(idx + dir + allCountries.length) % allCountries.length];
  openPanel(next.id);
}

function setActivePin(id) {
  if (!mapSvg) return;
  mapSvg.selectAll('.pin-group').classed('active', function() {
    return +this.getAttribute('data-id') === id;
  });
  mapSvg.selectAll('.flight-path').classed('active', function() {
    return +this.getAttribute('data-id') === id;
  });
}

function zoomToCountry(name) {
  if (!mapSvg || !mapProjection || !zoomBehavior) return;
  const lnglat = COORDS[name];
  if (!lnglat) return;
  const [px, py] = mapProjection(lnglat);
  const vb = mapSvg.attr('viewBox').split(' ').map(Number);
  const W = vb[2], H = vb[3];
  const k = Math.max(2, d3.zoomTransform(mapSvg.node()).k);
  const tx = (W - 640) / 2 - px * k;
  const ty = H / 2 - py * k;
  mapSvg.transition().duration(700)
    .call(zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(k));
}

function updateStats() {
  const el = document.getElementById('statsInfo');
  if (!el) return;
  el.textContent = `${allCountries.length} destinations`;
}

function setWishlistBtn(saved) {

function toggleWishlist() {
  if (currentId === null) return;
  savedIds.has(currentId) ? savedIds.delete(currentId) : savedIds.add(currentId);
  savePersist(); updateBadge();
  const nowSaved = savedIds.has(currentId);
  setWishlistBtn(nowSaved);
