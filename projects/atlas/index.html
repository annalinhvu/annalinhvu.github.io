// ── TOOLTIP ───────────────────────────────────────
const _tip = document.getElementById('mapTooltip');
function showTooltip(c, event) {
  document.getElementById('ttRegion').textContent  = (REGIONS[c.region]||c.region).toUpperCase();
  document.getElementById('ttName').textContent    = c.name;
  document.getElementById('ttTagline').textContent = c.tagline ? `"${c.tagline}"` : '';
  _tip.style.setProperty('--region-color', `var(--${c.region})`);
  _tip.classList.add('visible');
  moveTooltip(event);
}
function moveTooltip(event) {
  const x = event.clientX, y = event.clientY;
  const tw = _tip.offsetWidth, th = _tip.offsetHeight;
  const vw = window.innerWidth, vh = window.innerHeight;
  const ox = x + 16 + tw > vw ? x - tw - 12 : x + 16;
  const oy = y - 10 + th > vh ? y - th + 10  : y - 10;
  _tip.style.left = ox + 'px';
  _tip.style.top  = oy + 'px';
}
function hideTooltip() { _tip.classList.remove('visible'); }

// ── STAMP ─────────────────────────────────────────
function fireStamp(saved) {
  const s = document.getElementById('wishlistStamp');
  s.classList.remove('stamping','unstamping');
  void s.offsetWidth; // reflow
  if (saved) {
    s.classList.add('stamping');
    s.addEventListener('animationend', () => {
      setTimeout(() => {
        s.classList.remove('stamping');
        s.classList.add('unstamping');
        s.addEventListener('animationend', () => s.classList.remove('unstamping'), {once:true});
      }, 600);
    }, {once:true});
  }
}

// ── ZOOM CONTROLS ─────────────────────────────────
function mapZoomIn()    { mapSvg && mapSvg.transition().duration(320).call(zoomBehavior.scaleBy, 2); }
function mapZoomOut()   { mapSvg && mapSvg.transition().duration(320).call(zoomBehavior.scaleBy, 0.5); }
function mapZoomReset() { mapSvg && mapSvg.transition().duration(500).call(zoomBehavior.transform, d3.zoomIdentity); }

// ── FILTERS ───────────────────────────────────────
function applyFilters() {
  if (!mapSvg) return;
  const q = document.getElementById('searchInput').value.trim().toLowerCase();

  mapSvg.selectAll('.pin-group').each(function() {
    const id = +this.getAttribute('data-id');
    const c  = allCountries.find(x => x.id === id);
    d3.select(this).transition().duration(180)
      .style('opacity', c && matchesFilter(c, q) ? 1 : 0.12);
  });

  mapSvg.selectAll('.flight-path').each(function() {
    const id = +this.getAttribute('data-id');
    const c  = allCountries.find(x => x.id === id);
    // Only dim paths that have already been animated (dashoffset = 0)
    if (this.style.strokeDashoffset !== '' && parseFloat(this.style.strokeDashoffset) < 5) {
      d3.select(this).style('opacity', c && matchesFilter(c, q) ? 0.38 : 0.06);
    }
  });
}

function matchesFilter(c, q) {
  if (activeRegion !== 'all' && c.region !== activeRegion) return false;
  if (showingSaved && !savedIds.has(c.id)) return false;
  if (activeStatus && getStatus(c) !== activeStatus) return false;
  if (activeMonth) {
    const months = BEST_MONTHS[c.name] || [];
    if (!months.includes(+activeMonth)) return false;
  }
  if (activeVibe && !(c.vibe_tags||[]).includes(activeVibe)) return false;
  if (q) {
    const hay = [c.name, c.tagline, ...(c.vibe_tags||[])].join(' ').toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function onMonthChange() {
  activeMonth = document.getElementById('monthFilter').value;
  document.getElementById('monthFilter').classList.toggle('active', !!activeMonth);
  applyFilters();
}

function onVibeChange() {
  activeVibe = document.getElementById('vibeFilter').value;
  document.getElementById('vibeFilter').classList.toggle('active', !!activeVibe);
  applyFilters();
}

function onStatusChange() {
  activeStatus = document.getElementById('statusFilter').value;
  document.getElementById('statusFilter').classList.toggle('active', !!activeStatus);
  applyFilters();
}

function pickRandom() {
  const btn = document.querySelector('.random-btn');
  if (btn) {
    btn.classList.remove('popping');
    void btn.offsetWidth;
    btn.classList.add('popping');
    btn.addEventListener('animationend', () => btn.classList.remove('popping'), {once:true});
  }
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const pool = allCountries.filter(c => matchesFilter(c, q));
  if (!pool.length) return;
  // Avoid re-picking the same country if there are options
  const choices = pool.length > 1 ? pool.filter(c => c.id !== currentId) : pool;
  const pick = choices[Math.floor(Math.random() * choices.length)];
  openPanel(pick.id);
}

function switchTab(id, btn) {
  document.querySelectorAll('#panelInner .panel-tab-content').forEach(el => el.style.display = 'none');
  document.querySelectorAll('#panelInner .panel-tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(id).style.display = '';
  btn.classList.add('active');
}

function saveVisitedStates() { localStorage.setItem(US_STATES_KEY, JSON.stringify([...visitedStates])); }

function renderVisitedStatesList() {
  const countEl = document.getElementById('usStatesCount');
  if (countEl) countEl.textContent = visitedStates.size;
  const listEl = document.getElementById('usStatesList');
  if (!listEl) return;
  if (visitedStates.size === 0) {
    listEl.innerHTML = `<div class="us-states-empty">No states marked yet.</div>`;
    return;
  }
  listEl.innerHTML = [...visitedStates].sort().map(name =>
    `<span class="vibe-chip us-state-chip" data-state="${esc(name)}">${esc(name)}</span>`
  ).join('');
  listEl.querySelectorAll('.us-state-chip').forEach(el => {
    el.addEventListener('click', () => toggleUsState(el.dataset.state));
  });
}

function toggleUsState(name) {
  if (visitedStates.has(name)) visitedStates.delete(name); else visitedStates.add(name);
  saveVisitedStates();
  d3.selectAll('#usMapSvg path.us-state')
    .filter(d => d.properties.name === name)
    .classed('visited', visitedStates.has(name));
  renderVisitedStatesList();
}

function clearUsStates() {
  if (visitedStates.size === 0) return;
  visitedStates.clear();
  saveVisitedStates();
  d3.selectAll('#usMapSvg path.us-state').classed('visited', false);
  renderVisitedStatesList();
}

async function initUsStatesMap() {
  const wrap = document.getElementById('usMapWrap');
  if (!wrap) return;
  const loading = document.getElementById('usMapLoading');

  if (!usStatesFeatures) {
    try {
      const us = await d3.json('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json');
      usStatesFeatures = topojson.feature(us, us.objects.states).features;
    } catch (e) {
      if (loading) loading.textContent = 'Could not load map data.';
      return;
    }
    if (document.getElementById('usMapWrap') !== wrap) return; // panel moved on while loading
  }

  if (loading) loading.style.display = 'none';

  const width = wrap.clientWidth || 520, height = 320;
  const svg = d3.select('#usMapSvg').attr('viewBox', `0 0 ${width} ${height}`);
  const projection = d3.geoAlbersUsa().fitSize([width, height], { type: 'FeatureCollection', features: usStatesFeatures });
  const path = d3.geoPath(projection);

  const stateSel = svg.selectAll('path.us-state')
    .data(usStatesFeatures)
    .join('path')
      .attr('class', d => `us-state${visitedStates.has(d.properties.name) ? ' visited' : ''}`)
      .attr('d', path)
      .on('click', (event, d) => toggleUsState(d.properties.name));
  stateSel.selectAll('title').remove();
  stateSel.append('title').text(d => d.properties.name);

  svg.selectAll('text.us-state-abbr')
    .data(usStatesFeatures)
    .join('text')
      .attr('class', 'us-state-abbr')
      .attr('x', d => path.centroid(d)[0])
      .attr('y', d => path.centroid(d)[1])
      .text(d => STATE_ABBR[d.properties.name] || '');

  renderVisitedStatesList();
}

function toggleSavedFilter() {
  showingSaved = !showingSaved;
  document.getElementById('savedBtn').classList.toggle('active', showingSaved);
  applyFilters();
}

// ── CALENDAR VIEW ─────────────────────────────────
// Cities are scheduled as their own deck items, distinguished from country
// ids (numbers) by a string id of the form "city:<countryId>:<cityIndex>".
function calCityId(countryId, idx) { return `city:${countryId}:${idx}`; }

function calFindItem(id) {
  if (typeof id === 'number') return allCountries.find(x => x.id === id) || null;
  const m = /^city:(-?\d+):(\d+)$/.exec(id || '');
  if (!m) return null;
  const c = allCountries.find(x => x.id === +m[1]);
  if (!c) return null;
  const city = (c.cities || [])[+m[2]];
  if (!city) return null;
  return {
    id, name: city.name, region: c.region, isCity: true,
    parentId: c.id, parentName: c.name,
    ideal_days: Math.min(c.ideal_days || 7, 4) || 4,
    budget_breakdown: c.budget_breakdown,
    bestMonthsName: c.name,
  };
}

// Deck ids arrive from dataset attributes as strings — reconstruct the
// number/string split calFindItem expects.
function parseId(s) { return s && s.startsWith('city:') ? s : +s; }

// Safe to embed directly in an onclick="..." (double-quoted) attribute —
// city ids never contain a quote character.
function idLit(id) { return typeof id === 'string' ? `'${id}'` : String(id); }

function switchView(mode) {
  viewMode = mode;
  const isMap = mode === 'map';
  const isCal = mode === 'calendar';
  const isBudget = mode === 'budget';
  document.getElementById('mapWrap').style.display      = isMap ? '' : 'none';
  document.getElementById('controlsBar').style.display   = isMap ? '' : 'none';
  document.getElementById('calendarView').style.display  = isCal ? 'flex' : 'none';
  document.getElementById('budgetView').style.display    = isBudget ? 'flex' : 'none';
  document.getElementById('viewMapBtn').classList.toggle('active', isMap);
  document.getElementById('viewCalBtn').classList.toggle('active', isCal);
  document.getElementById('viewBudgetBtn').classList.toggle('active', isBudget);
  document.getElementById('randomBtn').style.display = isMap ? '' : 'none';
  document.getElementById('savedBtn').style.display   = isMap ? '' : 'none';
  if (isCal) {
    calSelectedId = null;
    document.getElementById('calHint').textContent = ('ontouchstart' in window)
      ? 'Tap a destination, then tap a month to schedule it'
      : 'Drag a destination onto a month — or tap, then tap a month';
    renderCalendar();
  }
  if (isBudget) renderBudget();
}

function calPlanKey() { return String(calYear); }
function getYearPlan() {
  if (!calendarPlan[calPlanKey()]) calendarPlan[calPlanKey()] = {};
  return calendarPlan[calPlanKey()];
}
function saveCalendarPlan() { localStorage.setItem(CAL_KEY, JSON.stringify(calendarPlan)); }

function findScheduledMonths(id) {
  const plan = getYearPlan();
  const months = [];
  for (const m in plan) { if ((plan[m]||[]).includes(id)) months.push(+m); }
  return months.sort((a, b) => a - b);
}

function assignToMonth(id, month) {
  const plan = getYearPlan();
  if (!plan[month]) plan[month] = [];
  if (!plan[month].includes(id)) plan[month].push(id);
  saveCalendarPlan();
  renderCalendar();
}

function removeFromMonth(id, month) {
  const plan = getYearPlan();
  if (plan[month]) plan[month] = plan[month].filter(x => x !== id);
  saveCalendarPlan();
  // Clean up any per-trip day/budget overrides for this scheduled slot
  const key = tripDaysKey(calYear, month, id);
  if (tripDays[key] !== undefined) { delete tripDays[key]; saveTripDays(); }
  if (tripBudgetOverrides[key] !== undefined) { delete tripBudgetOverrides[key]; saveTripBudget(); }
  renderCalendar();
}

function moveToMonth(id, fromMonth, toMonth) {
  if (fromMonth === toMonth) return;
  const plan = getYearPlan();
  if (plan[fromMonth]) plan[fromMonth] = plan[fromMonth].filter(x => x !== id);
  assignToMonth(id, toMonth);
}

// Clicking an existing chip's name normally opens its panel, but if a
// destination is currently selected (tap-to-assign mode), that selection
// takes priority so tapping near an occupied month still schedules it.
function calChipNameClick(id, month) {
  if (calSelectedId !== null) {
    assignToMonth(calSelectedId, month);
    calSelectedId = null;
  } else {
    const item = calFindItem(id);
    openPanel(item && item.isCity ? item.parentId : id);
  }
}

function calYearShift(dir) {
  calYear += dir;
  calSelectedId = null;
  if (viewMode === 'budget') renderBudget();
  else renderCalendar();
}

function renderCalendar() {
  if (!allCountries.length) return;
  document.getElementById('calYearLabel').textContent = calYear;
  renderCalDeck();
  renderCalGrid();
}

function calDeckBadge(id) {
  const months = findScheduledMonths(id);
  const badgeText = months.length === 1 ? MONTH_ABBR[months[0]-1]
    : months.length > 1 ? `${MONTH_ABBR[months[0]-1]} +${months.length-1}` : '';
  return badgeText ? `<span class="cal-deck-badge">${badgeText}</span>` : '';
}

function renderCalDeck() {
  const list = document.getElementById('calDeckList');
  const q = calSearch.toLowerCase();

  const items = allCountries.map(c => {
    const cities = (c.cities || []).map((city, idx) => ({ city, idx }));
    const countryMatches = !q || c.name.toLowerCase().includes(q);
    const matchingCities = q ? cities.filter(({ city }) => city.name.toLowerCase().includes(q)) : cities;
    if (q && !countryMatches && !matchingCities.length) return null;
    return {
      c, cities: countryMatches ? cities : matchingCities,
      autoExpand: q && !countryMatches && matchingCities.length > 0,
    };
  }).filter(Boolean).sort((a, b) => a.c.name.localeCompare(b.c.name));

  list.innerHTML = items.map(({ c, cities, autoExpand }) => {
    const expanded = cities.length > 0 && (autoExpand || calExpandedIds.has(c.id));
    const toggle = cities.length
      ? `<button class="cal-deck-toggle" type="button" data-toggle="${c.id}" title="${expanded ? 'Hide' : 'Show'} cities">${expanded ? '▾' : '▸'}</button>`
      : `<span class="cal-deck-toggle-spacer"></span>`;
    const countryRow = `<div class="cal-deck-item${c.id===calSelectedId?' selected':''}" draggable="true"
        data-id="${c.id}" style="--dot-color:var(--${c.region})">
      ${toggle}
      <span class="cal-deck-dot"></span>
      <span class="cal-deck-name">${esc(c.name)}</span>
      ${calDeckBadge(c.id)}
    </div>`;
    const cityRows = expanded ? cities.map(({ city, idx }) => {
      const cid = calCityId(c.id, idx);
      return `<div class="cal-deck-item cal-deck-city${cid===calSelectedId?' selected':''}" draggable="true"
          data-id="${cid}" style="--dot-color:var(--${c.region})">
        <span class="cal-deck-dot"></span>
        <span class="cal-deck-name">${esc(city.name)}</span>
        ${calDeckBadge(cid)}
      </div>`;
    }).join('') : '';
    return countryRow + cityRows;
  }).join('');

  list.querySelectorAll('.cal-deck-toggle').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const cid = +btn.dataset.toggle;
      if (calExpandedIds.has(cid)) calExpandedIds.delete(cid); else calExpandedIds.add(cid);
      renderCalDeck();
    });
  });

  list.querySelectorAll('.cal-deck-item').forEach(el => {
    const id = parseId(el.dataset.id);
    el.addEventListener('dragstart', e => {
      calDraggedId = id;
      calDragOriginMonth = null;
      el.classList.add('dragging');
      e.dataTransfer.setData('text/plain', String(id));
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); calDraggedId = null; calDragOriginMonth = null; });
    el.addEventListener('click', e => {
      if (e.target.closest('.cal-deck-toggle')) return;
      calSelectedId = calSelectedId === id ? null : id;
      renderCalDeck();
    });
  });
}

function renderCalGrid() {
  const grid = document.getElementById('calGrid');
  const plan = getYearPlan();
  let scheduledCount = 0;

  grid.innerHTML = MONTH_NAMES.map((name, i) => {
    const month = i + 1;
    const ids = plan[month] || [];
    scheduledCount += ids.length;
    const chips = ids.map(id => {
      const c = calFindItem(id);
      if (!c) return '';
      const sub = c.isCity ? `<span class="cal-chip-sub">${esc(c.parentName)}</span>` : '';
      return `<div class="cal-chip${c.isCity?' cal-chip-city':''}" draggable="true" style="--dot-color:var(--${c.region})" data-id="${id}" data-month="${month}">
        <span class="cal-chip-name" onclick="event.stopPropagation();calChipNameClick(${idLit(id)},${month})">${esc(c.name)}${sub}</span>
        <button class="cal-chip-remove" onclick="event.stopPropagation();removeFromMonth(${idLit(id)},${month})" title="Remove">×</button>
      </div>`;
    }).join('');
    return `<div class="cal-month" data-month="${month}">
      <div class="cal-month-head">
        <span class="cal-month-name">${name}</span>
        <span class="cal-month-count">${ids.length || ''}</span>
      </div>
      <div class="cal-month-body">${chips || '<div class="cal-month-empty">Drop here</div>'}</div>
    </div>`;
  }).join('');

  document.getElementById('calStats').textContent = `${scheduledCount} / ${calTotalItemCount} scheduled`;

  grid.querySelectorAll('.cal-chip').forEach(chipEl => {
    const id    = parseId(chipEl.dataset.id);
    const month = +chipEl.dataset.month;
    chipEl.addEventListener('dragstart', e => {
      calDraggedId = id;
      calDragOriginMonth = month;
      chipEl.classList.add('dragging');
      e.dataTransfer.setData('text/plain', String(id));
      e.dataTransfer.effectAllowed = 'move';
    });
    chipEl.addEventListener('dragend', () => {
      chipEl.classList.remove('dragging');
      calDraggedId = null;
      calDragOriginMonth = null;
    });
  });

  grid.querySelectorAll('.cal-month').forEach(cell => {
    const month = +cell.dataset.month;
    cell.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      cell.classList.add('drag-over');
      if (calDraggedId !== null) {
        const c = calFindItem(calDraggedId);
        const ideal = c && (BEST_MONTHS[c.bestMonthsName || c.name]||[]).includes(month);
        cell.classList.toggle('ideal', !!ideal);
      }
    });
    cell.addEventListener('dragleave', () => cell.classList.remove('drag-over', 'ideal'));
    cell.addEventListener('drop', e => {
      e.preventDefault();
      cell.classList.remove('drag-over', 'ideal');
      const id = calDraggedId;
      if (id === null || id === undefined) return;
      if (calDragOriginMonth !== null) {
        moveToMonth(id, calDragOriginMonth, month);
      } else {
        assignToMonth(id, month);
      }
      calDragOriginMonth = null;
    });
    cell.addEventListener('click', () => {
      if (calSelectedId !== null) {
        assignToMonth(calSelectedId, month);
        calSelectedId = null;
      }
    });
  });
}

document.getElementById('calSearchInput').addEventListener('input', e => {
  calSearch = e.target.value.trim();
  renderCalDeck();
});

// Drop a chip dragged out of a month back onto the deck to unschedule it
document.getElementById('calDeckList').addEventListener('dragover', e => {
  if (calDragOriginMonth === null) return; // only accept chips dragged out of a month
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.getElementById('calDeckList').classList.add('drag-over');
});
document.getElementById('calDeckList').addEventListener('dragleave', () => {
  document.getElementById('calDeckList').classList.remove('drag-over');
});
document.getElementById('calDeckList').addEventListener('drop', e => {
  document.getElementById('calDeckList').classList.remove('drag-over');
  if (calDragOriginMonth === null) return;
  e.preventDefault();
  const id = calDraggedId;
  if (id !== null && id !== undefined) removeFromMonth(id, calDragOriginMonth);
  calDragOriginMonth = null;
});

// ── BUDGET VIEW ───────────────────────────────────
function saveTripDays() { localStorage.setItem(TRIP_DAYS_KEY, JSON.stringify(tripDays)); }
function tripDaysKey(year, month, id) { return `${year}-${month}-${id}`; }

function getTripDays(c, year, month) {
  const override = tripDays[tripDaysKey(year, month, c.id)];
  return override || c.ideal_days || 7;
}

function setTripDays(id, month, value) {
  const c = calFindItem(id);
  if (!c) return;
  const days = Math.max(1, Math.min(90, Math.round(+value) || c.ideal_days || 7));
  tripDays[tripDaysKey(calYear, month, id)] = days;
  saveTripDays();
  renderBudget();
}

function saveTripBudget() { localStorage.setItem(TRIP_BUDGET_KEY, JSON.stringify(tripBudgetOverrides)); }

// Pre-fills each category from the computed estimate, but any category
// a person has edited by hand takes precedence and stays put even if
// the day count or other fields change afterward.
function getLineCost(c, year, month, days) {
  const computed = budgetLineCost(c, days);
  const override = tripBudgetOverrides[tripDaysKey(year, month, c.id)] || {};
  const merged = {};
  let total = 0;
  BUDGET_CAT_DEFS.forEach(([key]) => {
    const v = override[key] !== undefined ? override[key] : computed[key];
    merged[key] = v;
    total += v;
  });
  merged.total = total;
  return merged;
}

function setTripCategory(id, month, category, value) {
  const n = Math.max(0, Math.round(+value) || 0);
  const key = tripDaysKey(calYear, month, id);
  if (!tripBudgetOverrides[key]) tripBudgetOverrides[key] = {};
  tripBudgetOverrides[key][category] = n;
  saveTripBudget();
  renderBudget();
}

// Uses the high end of each daily-cost range (not the midpoint) — a
// deliberately conservative estimate — then rounds to clean $100
// increments so totals read like round trip-planning numbers, not
// falsely precise ones.
function budgetLineCost(c, days) {
  const bb = c.budget_breakdown || {};
  const nights = Math.max(days - 1, 1);
  const rate = key => bb[key] ? bb[key].high : 0;
  const round100 = n => Math.round(n / 100) * 100;
  const lodging   = round100(rate('lodging')   * nights);
  const food      = round100(rate('food')      * days);
  const fun       = round100(rate('fun')       * days);
  const transport = round100(rate('transport') * days);
  return { lodging, food, fun, transport, total: lodging + food + fun + transport };
}

function fmt$(n) { return '$' + Math.round(n).toLocaleString('en-US'); }

function renderBudget() {
  if (!allCountries.length) return;
  document.getElementById('budgetYearLabel').textContent = calYear;
  const content = document.getElementById('budgetContent');
  const plan = getYearPlan();

  const lines = [];
  for (let m = 1; m <= 12; m++) {
    (plan[m] || []).forEach(id => {
      const c = calFindItem(id);
      if (c) lines.push({ c, month: m });
    });
  }

  if (!lines.length) {
    content.innerHTML = `<div class="budget-empty">
      <div class="budget-empty-title">No trips scheduled yet</div>
      <div class="budget-empty-sub">Drag destinations onto months in the Calendar view first — this tab tallies up an estimated cost for whatever you've planned for ${calYear}.</div>
    </div>`;
    document.getElementById('budgetStats').textContent = '';
    return;
  }

  lines.sort((a, b) => a.month - b.month || a.c.name.localeCompare(b.c.name));

  let grandTotal = 0;
  const catTotals = { lodging: 0, food: 0, fun: 0, transport: 0 };

  const catInput = (c, month, key, value) => `<span class="budget-line-cat">
    <span class="budget-cat-prefix">$</span><input class="budget-cat-input" type="number" min="0" step="10" value="${Math.round(value)}"
      onchange="setTripCategory(${idLit(c.id)},${month},'${key}',this.value)">
  </span>`;

  const rows = lines.map(({ c, month }) => {
    const days = getTripDays(c, calYear, month);
    const cost = getLineCost(c, calYear, month, days);
    grandTotal += cost.total;
    BUDGET_CAT_DEFS.forEach(([key]) => catTotals[key] += cost[key]);
    const sub = c.isCity ? `<span class="budget-line-sub">${esc(c.parentName)}</span>` : '';
    return `<div class="budget-line-row">
      <span class="budget-line-dot" style="--dot-color:var(--${c.region})"></span>
      <span class="budget-line-name"><b>${esc(c.name)}</b>${sub}<span class="budget-line-month">${MONTH_ABBR[month-1]}</span></span>
      <span class="budget-line-days">
        <input class="budget-days-input" type="number" min="1" max="90" value="${days}"
          onchange="setTripDays(${idLit(c.id)},${month},this.value)"><span>days</span>
      </span>
      ${catInput(c, month, 'lodging', cost.lodging)}
      ${catInput(c, month, 'food', cost.food)}
      ${catInput(c, month, 'fun', cost.fun)}
      ${catInput(c, month, 'transport', cost.transport)}
      <span class="budget-line-total">${fmt$(cost.total)}</span>
      <button class="budget-line-remove" onclick="removeFromMonth(${idLit(c.id)},${month});renderBudget()" title="Remove">×</button>
    </div>`;
  }).join('');

  content.innerHTML = `
    <div class="budget-table-wrap">
      <div class="budget-head-row">
        <span></span><span>Trip</span><span>Days</span><span>Lodging</span><span>Food</span><span>Fun</span><span>Transport</span><span>Total</span><span></span>
      </div>
      ${rows}
    </div>
    <div class="budget-footer">
      <div class="budget-footer-note">
        <b>${fmt$(catTotals.lodging)}</b> lodging &middot; <b>${fmt$(catTotals.food)}</b> food &middot;
        <b>${fmt$(catTotals.fun)}</b> fun &middot; <b>${fmt$(catTotals.transport)}</b> transport<br>
        Save evenly across the year: <b>${fmt$(Math.ceil(grandTotal/12/25)*25)}</b>/month for ${calYear}
      </div>
      <div class="budget-footer-total">
        <div class="budget-footer-total-label">Total for ${calYear}</div>
        <div class="budget-footer-total-value">${fmt$(grandTotal)}</div>
      </div>
    </div>`;

  document.getElementById('budgetStats').textContent = `${lines.length} trip${lines.length===1?'':'s'} planned`;
}

// ── KEYBOARD ──────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePanel(); return; }
  if (currentId !== null) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') navigatePanel(1);
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   navigatePanel(-1);
  }
});

// ── EVENT LISTENERS ────────────────────────────────
document.querySelectorAll('.filter-pill').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('.filter-pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    activeRegion = p.dataset.region;
    applyFilters();
  });
});

let _st;
document.getElementById('searchInput').addEventListener('input', () => {
  clearTimeout(_st);
  _st = setTimeout(applyFilters, 150);
});

// ── BOOT ──────────────────────────────────────────
fetch('data/countries.json')
  .then(r => r.json())
  .then(async data => {
    allCountries = data;
    calTotalItemCount = allCountries.length + allCountries.reduce((s, c) => s + (c.cities||[]).length, 0);
    updateBadge();
    updateStats();
    // Populate vibe dropdown — top 10 vibes by frequency
    const TOP_VIBES = ['food culture','nature','history','architecture','hiking','city energy','ancient history','beaches','street food','mountains'];
    const vibeEl = document.getElementById('vibeFilter');
    TOP_VIBES.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v; opt.textContent = v;
      vibeEl.appendChild(opt);
    });
    await initMap();
    // Hash routing — open panel if URL has a destination slug
    if (location.hash) {
      const slug = location.hash.replace('#', '').toLowerCase();
      const match = allCountries.find(c => c.name.toLowerCase().replace(/\s+/g, '-') === slug);
      if (match) openPanel(match.id);
    }
  })
  .catch(() => {
    document.getElementById('mapLoading').textContent = 'Could not load destinations.';
  });

updateBadge();
</script>
